<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 824" role="img" aria-labelledby="title desc">
<title id="title">Power and Pack-a-Punch: six station landmarks</title><desc id="desc">Six numbered generators with recognizable room and perk landmarks; all six power the machine on the mound.</desc>
<rect width="1040" height="824" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Power and Pack-a-Punch: six station landmarks</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><rect x="36" y="139" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="170" font-size="23" fill="#c1cfab" font-weight="bold">1 · STARTING LABORATORY</text><text x="58" y="202" font-size="22" fill="#e3e7d8" font-weight="normal">Upper spawn area · Quick Revive · ritual reward chest</text><rect x="36" y="235" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="266" font-size="23" fill="#c1cfab" font-weight="bold">2 · TANK STATION</text><text x="58" y="298" font-size="22" fill="#e3e7d8" font-weight="normal">Outside the bunker at the end of the right spawn trench</text><rect x="36" y="331" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="362" font-size="23" fill="#c1cfab" font-weight="bold">3 · OTHER SPAWN TRENCH</text><text x="58" y="394" font-size="22" fill="#e3e7d8" font-weight="normal">Speed Cola side · near the Fire tunnel</text><rect x="36" y="427" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="458" font-size="23" fill="#c1cfab" font-weight="bold">4 · JUGGERNOG</text><text x="58" y="490" font-size="22" fill="#e3e7d8" font-weight="normal">No Man’s Land · beside the Wind tunnel</text><rect x="36" y="523" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="554" font-size="23" fill="#c1cfab" font-weight="bold">5 · STAMIN-UP</text><text x="58" y="586" font-size="22" fill="#e3e7d8" font-weight="normal">Other side of No Man’s Land · beside the Lightning tunnel</text><rect x="36" y="619" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="650" font-size="23" fill="#c1cfab" font-weight="bold">6 · BEHIND THE CHURCH</text><text x="58" y="682" font-size="22" fill="#e3e7d8" font-weight="normal">Rear courtyard · near the Ice tunnel</text><text x="48" y="757" font-size="22" fill="#e3e7d8" font-weight="normal">Keep all six operating to use Pack-a-Punch on top of excavation.</text><text x="36" y="799" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
