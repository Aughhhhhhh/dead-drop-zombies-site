<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
<title id="title">Rituals of the Ancients: four challenges and rewards</title><desc id="desc">Six generator captures yield Max Ammo, 115 ordinary headshots yield an upgraded rifle, spending 30,000 yields Double Tap, and four soul chests yield One Inch Punch.</desc>
<rect width="1040" height="800" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Rituals of the Ancients: four challenges and rewards</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><text x="48" y="148" font-size="22" fill="#acbca1" font-weight="normal">CLAIM A COMPLETED MEDAL AT GENERATOR 1 OR GENERATOR 6</text><rect x="36" y="182" width="968" height="100" rx="8" fill="#20271f" stroke="#91cce0" stroke-width="2"/><text x="60" y="217" font-size="22" fill="#91cce0" font-weight="bold">6 GENERATOR CAPTURES</text><text x="60" y="259" font-size="27" fill="#e3e7d8" font-weight="normal">Max Ammo</text><rect x="36" y="297" width="968" height="100" rx="8" fill="#20271f" stroke="#e1c46d" stroke-width="2"/><text x="60" y="332" font-size="22" fill="#e1c46d" font-weight="bold">115 ORDINARY HEADSHOTS</text><text x="60" y="374" font-size="27" fill="#e3e7d8" font-weight="normal">Upgraded Galil / STG-44 / SCAR-H</text><rect x="36" y="412" width="968" height="100" rx="8" fill="#20271f" stroke="#e29d83" stroke-width="2"/><text x="60" y="447" font-size="22" fill="#e29d83" font-weight="bold">30,000 POINTS SPENT</text><text x="60" y="489" font-size="27" fill="#e3e7d8" font-weight="normal">Double Tap II</text><rect x="36" y="527" width="968" height="100" rx="8" fill="#20271f" stroke="#bc9ade" stroke-width="2"/><text x="60" y="562" font-size="22" fill="#bc9ade" font-weight="bold">4 FOOTPRINT CHESTS</text><text x="60" y="604" font-size="27" fill="#e3e7d8" font-weight="normal">One Inch Punch</text><text x="48" y="686" font-size="23" fill="#e3e7d8" font-weight="normal">For nine perks: save the Double Tap medal until eight slots are full.</text><text x="48" y="727" font-size="23" fill="#e3e7d8" font-weight="normal">Headshots and spending are personal. Complete all four in one match.</text><text x="36" y="775" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
