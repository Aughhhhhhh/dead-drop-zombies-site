<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc">
<title id="title">Maxis Drone: brain, body and rotor</title><desc id="desc">The Maxis Drone’s seven possible part positions grouped into one brain, three body and three rotor sites.</desc>
<rect width="1040" height="728" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Maxis Drone: brain, body and rotor</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><rect x="36" y="139" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="170" font-size="23" fill="#c1cfab" font-weight="bold">BRAIN · ONE POSITION</text><text x="58" y="202" font-size="22" fill="#e3e7d8" font-weight="normal">Jar on the starting Laboratory’s table.</text><rect x="36" y="235" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="266" font-size="23" fill="#c1cfab" font-weight="bold">BODY · THREE POSITIONS</text><text x="58" y="298" font-size="22" fill="#e3e7d8" font-weight="normal">Ice tunnel bottom; Church-to-Gen 4 path; Church-to-Gen 5 path.</text><rect x="36" y="331" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="362" font-size="23" fill="#c1cfab" font-weight="bold">ROTOR · THREE POSITIONS</text><text x="58" y="394" font-size="22" fill="#e3e7d8" font-weight="normal">Top mound edge; Mule Kick stairs; internal oxygen-tank scaffolding.</text><rect x="36" y="427" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="458" font-size="23" fill="#c1cfab" font-weight="bold">BUILD · CHOOSE ONE FREE BENCH</text><text x="58" y="490" font-size="22" fill="#e3e7d8" font-weight="normal">Lower Workshop, Wind tunnel or lower Church.</text><rect x="36" y="523" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="554" font-size="23" fill="#c1cfab" font-weight="bold">TAKE · KEEP IT READY FOR QUEST WORK</text><text x="58" y="586" font-size="22" fill="#e3e7d8" font-weight="normal">Use it for the four yellow discs or the opened main-quest seal.</text><text x="48" y="661" font-size="22" fill="#e3e7d8" font-weight="normal">Recover the Drone at its bench after ordinary use and its recharge.</text><text x="36" y="703" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
