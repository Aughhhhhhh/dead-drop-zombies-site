<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img"><title>TESTSUBJECT • Playfair decoder</title><rect width="1100" height="740" fill="#0b1522"/><g font-family="Arial, sans-serif"><text x="40" y="55" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="start">TESTSUBJECT • Playfair decoder</text><text x="40" y="94" fill="#aabed0" font-size="19" font-weight="400" text-anchor="start">Keep J. V and W share a cell. Do not delete the real X in MEXICAN.</text><text x="226" y="154" fill="#aabed0" font-size="16" font-weight="400" text-anchor="middle">COLUMN</text><text x="98" y="188" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">1</text><text x="40" y="235" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">1</text><rect x="64" y="201" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="98" y="244" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">T</text><rect x="132" y="201" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="166" y="244" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">E</text><rect x="200" y="201" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="234" y="244" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">S</text><rect x="268" y="201" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="302" y="244" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">U</text><rect x="336" y="201" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="370" y="244" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">B</text><text x="166" y="188" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">2</text><text x="40" y="303" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">2</text><rect x="64" y="269" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="98" y="312" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">J</text><rect x="132" y="269" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="166" y="312" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">C</text><rect x="200" y="269" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="234" y="312" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">A</text><rect x="268" y="269" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="302" y="312" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">D</text><rect x="336" y="269" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="370" y="312" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">F</text><text x="234" y="188" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">3</text><text x="40" y="371" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">3</text><rect x="64" y="337" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="98" y="380" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">G</text><rect x="132" y="337" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="166" y="380" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">H</text><rect x="200" y="337" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="234" y="380" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">I</text><rect x="268" y="337" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="302" y="380" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">K</text><rect x="336" y="337" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="370" y="380" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">L</text><text x="302" y="188" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">4</text><text x="40" y="439" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">4</text><rect x="64" y="405" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="98" y="448" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">M</text><rect x="132" y="405" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="166" y="448" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">N</text><rect x="200" y="405" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="234" y="448" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">O</text><rect x="268" y="405" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="302" y="448" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">P</text><rect x="336" y="405" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="370" y="448" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">Q</text><text x="370" y="188" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">5</text><text x="40" y="507" fill="#f1bd56" font-size="22" font-weight="400" text-anchor="middle">5</text><rect x="64" y="473" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="98" y="516" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">R</text><rect x="132" y="473" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="166" y="516" fill="#f1bd56" font-size="27" font-weight="700" text-anchor="middle">V/W</text><rect x="200" y="473" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="234" y="516" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">X</text><rect x="268" y="473" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="302" y="516" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">Y</text><rect x="336" y="473" width="68" height="68" rx="0" fill="#142235" stroke="#39526a"/><text x="370" y="516" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="middle">Z</text><text x="40" y="588" fill="#aabed0" font-size="21" font-weight="400" text-anchor="start">ROW first, then COLUMN. Both use 1–5.</text><text x="490" y="168" fill="#f1bd56" font-size="25" font-weight="700" text-anchor="start">SAME ROW</text><text x="490" y="205" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">Move both letters one cell left.</text><text x="490" y="259" fill="#f1bd56" font-size="25" font-weight="700" text-anchor="start">SAME COLUMN</text><text x="490" y="296" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">Move both letters one cell up.</text><text x="490" y="350" fill="#f1bd56" font-size="25" font-weight="700" text-anchor="start">RECTANGLE</text><text x="490" y="387" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">Keep the rows and swap columns.</text><text x="490" y="441" fill="#f1bd56" font-size="25" font-weight="700" text-anchor="start">Example: EG → TH</text><text x="490" y="483" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">Wrap at an edge. Decode pairs in order.</text><text x="490" y="525" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">Remove filler Xs; read doubled VV as W.</text><text x="40" y="648" fill="#e8edf5" font-size="23" font-weight="700" text-anchor="start">Use UB at pair 7 → SU. The inherited EB copy → TU is wrong.</text><text x="40" y="716" fill="#aabed0" font-size="16" font-weight="400" text-anchor="start">Original decoder diagram • Not a gameplay photograph</text></g></svg>
