<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 880" role="img" aria-labelledby="title desc">
<title id="title">Extra perk slots: shovel, blood, bottle, purchase</title><desc id="desc">The BO2 perk-slot sequence is 30 personal digs for a Golden Shovel, Zombie Blood to see a special mound, collect its Empty Perk Bottle, then buy the next perk. Four bottles make eight normal slots.</desc>
<rect width="1040" height="880" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Extra perk slots: shovel, blood, bottle, purchase</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><text x="48" y="150" font-size="25" fill="#e1c46d" font-weight="bold">PERSONAL DIG PROGRESS</text><rect x="36" y="182" width="968" height="130" rx="8" fill="#20271f" stroke="#b69f57" stroke-width="2"/><text x="60" y="217" font-size="25" fill="#e1c46d" font-weight="bold">30 ORDINARY DIGS</text><text x="60" y="257" font-size="24" fill="#e3e7d8" font-weight="normal">Your shovel turns gold.</text><text x="60" y="292" font-size="23" fill="#e3e7d8" font-weight="normal">The Golden Helmet is optional.</text><rect x="36" y="327" width="968" height="130" rx="8" fill="#20271f" stroke="#b69f57" stroke-width="2"/><text x="60" y="362" font-size="25" fill="#e1c46d" font-weight="bold">GOLDEN SHOVEL + ZOMBIE BLOOD</text><text x="60" y="402" font-size="24" fill="#e3e7d8" font-weight="normal">Find your orange/red glowing mound.</text><text x="60" y="437" font-size="23" fill="#e3e7d8" font-weight="normal">Dig it and collect the Empty Perk Bottle.</text><rect x="36" y="472" width="968" height="130" rx="8" fill="#20271f" stroke="#b69f57" stroke-width="2"/><text x="60" y="507" font-size="25" fill="#e1c46d" font-weight="bold">ONE COLLECTED BOTTLE = ONE SLOT</text><text x="60" y="547" font-size="24" fill="#e3e7d8" font-weight="normal">Buy a perk to fill the new capacity.</text><text x="60" y="582" font-size="23" fill="#e3e7d8" font-weight="normal">Wait for a later round for your next mound.</text><rect x="36" y="617" width="968" height="130" rx="8" fill="#20271f" stroke="#b69f57" stroke-width="2"/><text x="60" y="652" font-size="25" fill="#e1c46d" font-weight="bold">FOUR BOTTLES = EIGHT NORMAL SLOTS</text><text x="60" y="692" font-size="24" fill="#e3e7d8" font-weight="normal">Buy the eight perks other than Double Tap.</text><text x="60" y="727" font-size="23" fill="#e3e7d8" font-weight="normal">Claim saved ritual Double Tap last for nine.</text><text x="48" y="804" font-size="23" fill="#e3e7d8" font-weight="normal">The bottle adds a slot, not a random perk. Slots persist after a down.</text><text x="36" y="855" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
