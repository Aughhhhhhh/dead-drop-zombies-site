<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#19181f"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#716480"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c5b8d5" font-size="12" letter-spacing="2">DEAD OF THE NIGHT · CLASSIC</text><text x="36" y="86" fill="#f4eff5" font-size="24" font-weight="700">Chaos Theory</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#2e2736"/><text x="49" y="137" fill="#d6c4dc" font-size="17" font-weight="700">Werewolf material</text><text x="49" y="159" fill="#ede3ef" font-size="14">Use silver bullets; collect the</text><text x="49" y="177" fill="#ede3ef" font-size="14">dropped part</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#2e2736"/><text x="49" y="253" fill="#d6c4dc" font-size="17" font-weight="700">Process at the Laboratory</text><text x="49" y="275" fill="#ede3ef" font-size="14">Collect the output from the left</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#2e2736"/><text x="49" y="369" fill="#d6c4dc" font-size="17" font-weight="700">Library shelf part</text><text x="49" y="391" fill="#ede3ef" font-size="14">Use the Ballistic Shield to break it</text><text x="49" y="409" fill="#ede3ef" font-size="14">open</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#2e2736"/><text x="49" y="485" fill="#d6c4dc" font-size="17" font-weight="700">Craft at the Laboratory</text><text x="49" y="507" fill="#ede3ef" font-size="14">Use the back-right Greenhouse</text><text x="49" y="525" fill="#ede3ef" font-size="14">workbench</text><text x="36" y="600" fill="#bdb0c3" font-size="12">First upgrade; the Library supplies a part,</text><text x="36" y="617" fill="#bdb0c3" font-size="12">not the crafting bench.</text></g></svg>
