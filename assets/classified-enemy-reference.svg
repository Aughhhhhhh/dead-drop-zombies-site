<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#111c1c"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#52716d"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#a6ccc0" font-size="12" letter-spacing="2">CLASSIFIED · CLASSIC</text><text x="36" y="86" fill="#f0f5ec" font-size="24" font-weight="700">Crawler challenge reference</text><rect x="35" y="112" width="350" height="102" rx="7" fill="#20302c"/><text x="49" y="137" fill="#bfdbbf" font-size="17" font-weight="700">Nova Six Crawlers</text><text x="49" y="159" fill="#e0e9df" font-size="14">Bullet kills can leave a blinding</text><text x="49" y="177" fill="#e0e9df" font-size="14">gas cloud</text><rect x="35" y="224" width="350" height="102" rx="7" fill="#20302c"/><text x="49" y="249" fill="#bfdbbf" font-size="17" font-weight="700">Hellhounds</text><text x="49" y="271" fill="#e0e9df" font-size="14">Faster movement; less health than</text><text x="49" y="289" fill="#e0e9df" font-size="14">zombies</text><rect x="35" y="336" width="350" height="102" rx="7" fill="#20302c"/><text x="49" y="361" fill="#bfdbbf" font-size="17" font-weight="700">Preemptive Strike</text><text x="49" y="383" fill="#e0e9df" font-size="14">50 crawler kills without their</text><text x="49" y="401" fill="#e0e9df" font-size="14">explosions</text><rect x="35" y="448" width="350" height="102" rx="7" fill="#20302c"/><text x="49" y="473" fill="#bfdbbf" font-size="17" font-weight="700">Step on the Gas</text><text x="49" y="495" fill="#e0e9df" font-size="14">50 zombie kills while affected by</text><text x="49" y="513" fill="#e0e9df" font-size="14">gas</text><text x="36" y="600" fill="#a8b9ae" font-size="12">Original objective summary; exact weapon</text><text x="36" y="617" fill="#a8b9ae" font-size="12">suppression and team credit remain unchecked.</text></g></svg>
