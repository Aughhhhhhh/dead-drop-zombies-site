<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Zetsubou No Shima melody bulb water amounts</title><desc id="desc">Facing the bulbs beside the purple water, fill the first six from left to right with one, three, five, six, seven and five pours. The seventh bulb starts the music.</desc>
<rect width="1200" height="650" fill="#151810"/>
<g font-family="Arial,sans-serif" fill="#e9ecdf">
<text x="55" y="65" font-size="18" fill="#cf7a3c" letter-spacing="3">ZETSUBOU NO SHIMA / SAMANTHA'S LULLABY</text>
<text x="55" y="120" font-size="40" font-weight="bold">Fill each bulb. Then play the song.</text>
<text x="55" y="164" font-size="22" fill="#b6bba8">Face the wall beside the purple water. These are POUR COUNTS, left to right.</text>
<g stroke="#b8a3e1" stroke-width="3" fill="#29273d">
<path d="M105 235h60v95a40 40 0 1 1-60 0z"/><path d="M260 235h60v95a40 40 0 1 1-60 0z"/>
<path d="M415 235h60v95a40 40 0 1 1-60 0z"/><path d="M570 235h60v95a40 40 0 1 1-60 0z"/>
<path d="M725 235h60v95a40 40 0 1 1-60 0z"/><path d="M880 235h60v95a40 40 0 1 1-60 0z"/>
</g>
<g text-anchor="middle" font-size="48" font-weight="bold"><text x="135" y="368">1</text><text x="290" y="368">3</text><text x="445" y="368">5</text><text x="600" y="368">6</text><text x="755" y="368">7</text><text x="910" y="368">5</text></g>
<circle cx="1065" cy="350" r="48" stroke="#cf7a3c" stroke-width="3" fill="#33251b"/><polygon points="1051,326 1051,374 1090,350" fill="#cf7a3c"/>
<g text-anchor="middle" font-size="20" fill="#b6bba8"><text x="135" y="438">BULB 1</text><text x="290" y="438">BULB 2</text><text x="445" y="438">BULB 3</text><text x="600" y="438">BULB 4</text><text x="755" y="438">BULB 5</text><text x="910" y="438">BULB 6</text><text x="1065" y="438">PLAY</text></g>
<text x="55" y="521" font-size="23">Refill your bucket with purple water as needed.</text>
<text x="55" y="560" font-size="23">Too much in a bulb? Knife that bulb and fill it again.</text>
<text x="55" y="610" font-size="18" fill="#9ca28f">Original schematic based on FreeMetal's Steam guide. Bulb shapes are illustrative.</text>
</g></svg>
