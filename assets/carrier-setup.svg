<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#20292c"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#78a6aa"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#afced0" font-size="12" letter-spacing="2">CARRIER · EXO ZOMBIES</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Setup and special rounds</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#2c3c40"/><text x="49" y="137" fill="#c0e0e2" font-size="17" font-weight="700">Local power and suit</text><text x="49" y="159" fill="#e0e9eb" font-size="14">Open the route and read the machine</text><text x="49" y="177" fill="#e0e9eb" font-size="14">prompts</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#2c3c40"/><text x="49" y="253" fill="#c0e0e2" font-size="17" font-weight="700">Four Printer areas</text><text x="49" y="275" fill="#e0e9eb" font-size="14">Gun Deck, Hangar, Moon Pool and</text><text x="49" y="293" fill="#e0e9eb" font-size="14">Armory</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#2c3c40"/><text x="49" y="369" fill="#c0e0e2" font-size="17" font-weight="700">Defuse the bombs</text><text x="49" y="391" fill="#e0e9eb" font-size="14">Follow the alert; clear guards and</text><text x="49" y="409" fill="#e0e9eb" font-size="14">use their cloak</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#2c3c40"/><text x="49" y="485" fill="#c0e0e2" font-size="17" font-weight="700">Gas and infection</text><text x="49" y="507" fill="#e0e9eb" font-size="14">Keep a decontamination route</text><text x="49" y="525" fill="#e0e9eb" font-size="14">available</text><text x="36" y="600" fill="#b7cbd0" font-size="12">Historical written reference; exact controls,</text><text x="36" y="617" fill="#b7cbd0" font-size="12">prices and timing remain qualified in the</text><text x="36" y="634" fill="#b7cbd0" font-size="12">guide.</text></g></svg>
