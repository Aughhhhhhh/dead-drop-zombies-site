<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#222820"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#89956d"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2b8" font-size="12" letter-spacing="2">INFECTION · EXO ZOMBIES</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Exo perks</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#35402d"/><text x="49" y="137" fill="#d4e0b8" font-size="17" font-weight="700">Exo Suit first</text><text x="49" y="159" fill="#e2ebdc" font-size="14">The written solo Medic rule has an</text><text x="49" y="177" fill="#e2ebdc" font-size="14">exception</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#35402d"/><text x="49" y="253" fill="#d4e0b8" font-size="17" font-weight="700">Five archived entries</text><text x="49" y="275" fill="#e2ebdc" font-size="14">Read each machine location, price</text><text x="49" y="293" fill="#e2ebdc" font-size="14">and effect</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#35402d"/><text x="49" y="369" fill="#d4e0b8" font-size="17" font-weight="700">Medic in solo and co-op</text><text x="49" y="391" fill="#e2ebdc" font-size="14">The revive function depends on the</text><text x="49" y="409" fill="#e2ebdc" font-size="14">match type</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#35402d"/><text x="49" y="485" fill="#d4e0b8" font-size="17" font-weight="700">Blackout warning</text><text x="49" y="507" fill="#e2ebdc" font-size="14">Check local power after a failed</text><text x="49" y="525" fill="#e2ebdc" font-size="14">survivor rescue</text><text x="36" y="600" fill="#b7c5a8" font-size="12">Historical reference; exact suit-rack and</text><text x="36" y="617" fill="#b7c5a8" font-size="12">repurchase rules remain open.</text></g></svg>
