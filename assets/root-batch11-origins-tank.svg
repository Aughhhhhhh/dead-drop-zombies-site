<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc">
<title id="title">Tank journey: two departures, three staff jumps</title><desc id="desc">A schematic sequence of the Church-to-Tank-Station trip, cooldown, and three Lightning Staff jumps; not a scale map.</desc>
<rect width="1040" height="728" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Tank journey: two departures, three staff jumps</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><rect x="36" y="139" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="170" font-size="23" fill="#c1cfab" font-weight="bold">START · LOWER CHURCH</text><text x="58" y="202" font-size="22" fill="#e3e7d8" font-weight="normal">Board the tank and pay 500 when ready.</text><rect x="36" y="235" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="266" font-size="23" fill="#c1cfab" font-weight="bold">OUTBOUND · CHURCH → TANK STATION</text><text x="58" y="298" font-size="22" fill="#e3e7d8" font-weight="normal">Jump RIGHT to the Generator 3-side raised wooden platform.</text><rect x="36" y="331" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="362" font-size="23" fill="#c1cfab" font-weight="bold">STOP · GENERATOR 2</text><text x="58" y="394" font-size="22" fill="#e3e7d8" font-weight="normal">Wait for the engine to cool and the departure control to return.</text><rect x="36" y="427" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="458" font-size="23" fill="#c1cfab" font-weight="bold">RETURN · TANK STATION → CHURCH</text><text x="58" y="490" font-size="22" fill="#e3e7d8" font-weight="normal">Jump LEFT to the excavation ledge near Generator 5.</text><rect x="36" y="523" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="554" font-size="23" fill="#c1cfab" font-weight="bold">RETURN · BEFORE THE CHURCH STOP</text><text x="58" y="586" font-size="22" fill="#e3e7d8" font-weight="normal">Jump RIGHT toward the broken Church wall for the last part.</text><text x="48" y="661" font-size="22" fill="#e3e7d8" font-weight="normal">Missed a jump? Take another circuit; the part is not reached from the mud.</text><text x="36" y="703" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
