<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#171f25"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#6d7b86"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">ALPHA OMEGA · STANDARD</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Weapon catalogue</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">53 archived entries</text><text x="49" y="159" fill="#e2ebec" font-size="14">Read locations, source prices and</text><text x="49" y="177" fill="#e2ebec" font-size="14">packed names</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Four later acquisitions</text><text x="49" y="275" fill="#e2ebec" font-size="14">Grav, MP-40, M16 and Havelina AA50</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">Mark II family</text><text x="49" y="391" fill="#e2ebec" font-size="14">Five base forms and their named</text><text x="49" y="409" fill="#e2ebec" font-size="14">packed forms</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Historical source limits</text><text x="49" y="507" fill="#e2ebec" font-size="14">Missing aliases do not establish</text><text x="49" y="525" fill="#e2ebec" font-size="14">extra upgrades</text><text x="36" y="600" fill="#afc1c5" font-size="12">Current complete Box pools and later packed</text><text x="36" y="617" fill="#afc1c5" font-size="12">aliases remain unverified.</text></g></svg>
