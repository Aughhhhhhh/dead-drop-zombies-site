<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">TranZit Tower of Babble pylon routes</title><desc id="d">Maxis and Richtofen routes beneath the pylon and at the green street lamps.</desc><rect width="1400" height="820" fill="#090909"/><text x="700" y="55" fill="#fff" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">TOWER OF BABEL · CHOOSE ONE ROUTE</text><g font-family="Arial"><rect x="55" y="95" width="620" height="610" rx="28" fill="#151515" stroke="#dc8c3f" stroke-width="5"/><text x="365" y="145" fill="#dc8c3f" font-size="34" font-weight="700" text-anchor="middle">MAXIS · POWER OFF</text><text x="100" y="205" fill="#fff" font-size="26">1. Release Avogadro, then turn power OFF.</text><text x="100" y="260" fill="#fff" font-size="26">2. Place 2 fresh Turbines beneath pylon.</text><text x="100" y="315" fill="#fff" font-size="26">3. Lure Avogadro directly under tower.</text><text x="100" y="370" fill="#fff" font-size="26">4. EMP him without disabling Turbines.</text><text x="100" y="425" fill="#fff" font-size="26">5. Place Turbines under 2 green lamps.</text><circle cx="215" cy="555" r="52" fill="#222" stroke="#dc8c3f" stroke-width="6"/><circle cx="510" cy="555" r="52" fill="#222" stroke="#dc8c3f" stroke-width="6"/><text x="215" y="565" fill="#fff" font-size="22" text-anchor="middle">LAMP A</text><text x="510" y="565" fill="#fff" font-size="22" text-anchor="middle">LAMP B</text><path d="M265 555H460" stroke="#dc8c3f" stroke-width="6" stroke-dasharray="15 12"/><text x="365" y="650" fill="#aaa" font-size="22" text-anchor="middle">Orange orbs fly from both lamps to the pylon.</text><rect x="725" y="95" width="620" height="610" rx="28" fill="#151515" stroke="#5e9cff" stroke-width="5"/><text x="1035" y="145" fill="#5e9cff" font-size="34" font-weight="700" text-anchor="middle">RICHTOFEN · POWER ON</text><text x="770" y="205" fill="#fff" font-size="26">1. Fully cool Jet Gun for 40–60 seconds.</text><text x="770" y="260" fill="#fff" font-size="26">2. Fire beneath pylon until it breaks.</text><text x="770" y="315" fill="#fff" font-size="26">3. Earn 25 explosive kills under tower.</text><text x="770" y="370" fill="#fff" font-size="26">4. EMP 4 different green lamps together.</text><g fill="#222" stroke="#5e9cff" stroke-width="5"><circle cx="825" cy="535" r="43"/><circle cx="965" cy="535" r="43"/><circle cx="1105" cy="535" r="43"/><circle cx="1245" cy="535" r="43"/></g><g fill="#fff" font-size="20" text-anchor="middle"><text x="825" y="542">1</text><text x="965" y="542">2</text><text x="1105" y="542">3</text><text x="1245" y="542">4</text></g><text x="1035" y="650" fill="#aaa" font-size="22" text-anchor="middle">Fewer than 4 players: use Denizen portals between lamps.</text><path d="M365 750H1035" stroke="#444" stroke-width="4"/><text x="700" y="790" fill="#fff" font-size="24" text-anchor="middle">Pylon is in the cornfield between Farm and Power Station.</text></g></svg>