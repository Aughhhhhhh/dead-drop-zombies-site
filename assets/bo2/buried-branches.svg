<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Buried Mined Games branch comparison</title><desc id="d">Richtofen Guillotine and Maxis Gallows routes, shared-part warning, and the shared Sharpshooter finale.</desc><rect width="1500" height="900" fill="#090909"/><text x="750" y="55" fill="#fff" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">MINED GAMES · BUILD ONE STRUCTURE ONLY</text><g font-family="Arial"><rect x="70" y="100" width="650" height="595" rx="28" fill="#151515" stroke="#5e9cff" stroke-width="5"/><text x="395" y="150" fill="#5e9cff" font-size="34" text-anchor="middle" font-weight="700">RICHTOFEN · GUILLOTINE</text><text x="115" y="205" fill="#fff" font-size="25">Parts: satellite · crystal · wire · antenna</text><text x="115" y="260" fill="#fff" font-size="25">Paralyzer 4 orbs until white + ding</text><text x="115" y="315" fill="#fff" font-size="25">Lantern: charge with ~10 mansion ghosts</text><text x="115" y="370" fill="#fff" font-size="25">Decode 3 signs · Vulture Aid wisp</text><text x="115" y="425" fill="#fff" font-size="25">Kill glowing zombies at Guillotine</text><text x="115" y="480" fill="#fff" font-size="25">Time Bomb → Round Infinity switch</text><text x="115" y="535" fill="#fff" font-size="25">Solve random 4-lever maze order</text><rect x="780" y="100" width="650" height="595" rx="28" fill="#151515" stroke="#dc8c3f" stroke-width="5"/><text x="1105" y="150" fill="#dc8c3f" font-size="34" text-anchor="middle" font-weight="700">MAXIS · GALLOWS</text><text x="825" y="205" fill="#fff" font-size="25">Parts: battery · bulbs · wire · antenna</text><text x="825" y="260" fill="#fff" font-size="25">Resonator destroys all 4 orbs</text><text x="825" y="315" fill="#fff" font-size="25">Lantern: Arthur / traps / Nuke kills</text><text x="825" y="370" fill="#fff" font-size="25">Decode 3 signs · pre-place Time Bomb</text><text x="825" y="425" fill="#fff" font-size="25">Escort Spire to Gallows twice</text><text x="825" y="480" fill="#fff" font-size="25">Map 3 × 3 mansion switchboard</text><text x="825" y="535" fill="#fff" font-size="25">Ring all 9 bells under timer</text><rect x="245" y="745" width="1010" height="105" rx="24" fill="#151515" stroke="#a775ff" stroke-width="5"/><text x="750" y="790" fill="#a775ff" font-size="29" text-anchor="middle" font-weight="700">SHARED FINAL: MAKE A WISH → HIT EVERY TARGET IN ALL 4 RANGES</text><text x="750" y="825" fill="#aaa" font-size="21" text-anchor="middle">Wire and antenna are shared. Attaching either to the wrong bench can lock the intended route.</text><path d="M395 695l180 50M1105 695l-180 50" stroke="#a775ff" stroke-width="7"/></g></svg>