<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Die Rise High Maintenance branch and Mahjong flow</title><desc id="d">Shared steps, Maxis and Richtofen branches, and the randomized Mahjong pairing method.</desc><rect width="1500" height="900" fill="#090909"/><text x="750" y="55" fill="#fff" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">HIGH MAINTENANCE · SHARED START → BRANCH → MAHJONG</text><g font-family="Arial"><rect x="80" y="100" width="1340" height="145" rx="24" fill="#151515" stroke="#777" stroke-width="4"/><text x="750" y="145" fill="#fff" font-size="30" text-anchor="middle" font-weight="700">SHARED</text><text x="750" y="195" fill="#ccc" font-size="26" text-anchor="middle">4 elevator symbols together → 4 random floor symbols in order → shoot both dragon balls with a sniper</text><rect x="80" y="295" width="620" height="270" rx="24" fill="#151515" stroke="#dc8c3f" stroke-width="5"/><text x="390" y="345" fill="#dc8c3f" font-size="32" text-anchor="middle" font-weight="700">MAXIS</text><text x="120" y="395" fill="#fff" font-size="25">15 uninterrupted Buddha-room kills</text><text x="120" y="440" fill="#fff" font-size="25">Krauss Refibrillator reincarnation shot</text><text x="120" y="485" fill="#fff" font-size="25">4 lion-symbol Trample Steams</text><text x="120" y="530" fill="#fff" font-size="25">Place 2 balls → orange pylon</text><rect x="800" y="295" width="620" height="270" rx="24" fill="#151515" stroke="#5e9cff" stroke-width="5"/><text x="1110" y="345" fill="#5e9cff" font-size="32" text-anchor="middle" font-weight="700">RICHTOFEN</text><text x="840" y="395" fill="#fff" font-size="25">Spin both balls with Sliquifier</text><text x="840" y="440" fill="#fff" font-size="25">4 zombie-symbol Trample Steams</text><text x="840" y="485" fill="#fff" font-size="25">Trigger launchers repeatedly</text><text x="840" y="530" fill="#fff" font-size="25">Blue pylon</text><path d="M750 245L390 295M750 245l360 50" stroke="#f5b078" stroke-width="7"/><rect x="180" y="630" width="1140" height="190" rx="24" fill="#151515" stroke="#a775ff" stroke-width="5"/><text x="750" y="675" fill="#a775ff" font-size="30" text-anchor="middle" font-weight="700">FINAL · RANDOM MAHJONG ORDER</text><text x="750" y="720" fill="#fff" font-size="25" text-anchor="middle">Pair each numbered bird tile (1–4) with the direction tile of the same color.</text><text x="750" y="760" fill="#fff" font-size="25" text-anchor="middle">Punch those pylon sides with Galvaknuckles in number order.</text><text x="750" y="800" fill="#aaa" font-size="22" text-anchor="middle">North = fixed pylon-tile side, facing away from the Power Building. One attempt per round.</text><path d="M390 565l170 65M1110 565L940 630" stroke="#a775ff" stroke-width="7"/></g></svg>