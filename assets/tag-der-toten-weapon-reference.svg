<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#171f25"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#6d7b86"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">TAG DER TOTEN · CLASSIC</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Weapon reference</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">Named landmarks</text><text x="49" y="159" fill="#e2ebec" font-size="14">Five written wall-gun landmarks plus a</text><text x="49" y="177" fill="#e2ebec" font-size="14">reported Beach M1927.</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Normal machine</text><text x="49" y="275" fill="#e2ebec" font-size="14">Return the blue rock to the Hermit and</text><text x="49" y="293" fill="#e2ebec" font-size="14">follow the spotlight.</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">Golden machine</text><text x="49" y="391" fill="#e2ebec" font-size="14">The written setup lists a 5,000-point full</text><text x="49" y="409" fill="#e2ebec" font-size="14">upgrade where applicable.</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Packed names</text><text x="49" y="507" fill="#e2ebec" font-size="14">Five aliases are a BO4 comparison; they</text><text x="49" y="525" fill="#e2ebec" font-size="14">were not tested on Tag here.</text><text x="36" y="600" fill="#afc1c5" font-size="12">Partial acquisition reference. The complete current</text><text x="36" y="617" fill="#afc1c5" font-size="12">weapon pool remains open.</text></g></svg>
