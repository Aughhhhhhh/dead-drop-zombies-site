<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 870" role="img" aria-labelledby="title desc">
<title id="title">Lightning Staff: seven panel handle directions</title><desc id="desc">Seven Lightning Staff panel settings: spawn left, Tank Station down, Generator 4 up, Generator 5 down, lower Church right, upper Church up, mound wall up. Ignore Workshop.</desc>
<rect width="1040" height="870" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Lightning Staff: seven panel handle directions</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><text x="48" y="147" font-size="24" fill="#e3e7d8" font-weight="normal">Face each electrical panel directly. Turn its handle with Interact.</text><rect x="36" y="184" width="476" height="115" rx="8" fill="#20271f" stroke="#8a73a8" stroke-width="2"/><text x="55" y="216" font-size="22" fill="#e3e7d8" font-weight="normal">Spawn stairs</text><text x="55" y="264" font-size="28" fill="#ceb2ee" font-weight="bold">LEFT</text><circle cx="443" cy="250" r="34" fill="#151b16" stroke="#8a73a8"/><path d="M443 250l-31 0" stroke="#ceb2ee" stroke-width="7" stroke-linecap="round"/><rect x="528" y="184" width="476" height="115" rx="8" fill="#20271f" stroke="#8a73a8" stroke-width="2"/><text x="547" y="216" font-size="22" fill="#e3e7d8" font-weight="normal">Tank Station rear</text><text x="547" y="264" font-size="28" fill="#ceb2ee" font-weight="bold">DOWN</text><circle cx="935" cy="250" r="34" fill="#151b16" stroke="#8a73a8"/><path d="M935 250l0 31" stroke="#ceb2ee" stroke-width="7" stroke-linecap="round"/><rect x="36" y="317" width="476" height="115" rx="8" fill="#20271f" stroke="#8a73a8" stroke-width="2"/><text x="55" y="349" font-size="22" fill="#e3e7d8" font-weight="normal">Generator 4 · Wind tunnel</text><text x="55" y="397" font-size="28" fill="#ceb2ee" font-weight="bold">UP</text><circle cx="443" cy="383" r="34" fill="#151b16" stroke="#8a73a8"/><path d="M443 383l0 -31" stroke="#ceb2ee" stroke-width="7" stroke-linecap="round"/><rect x="528" y="317" width="476" height="115" rx="8" fill="#20271f" stroke="#8a73a8" stroke-width="2"/><text x="547" y="349" font-size="22" fill="#e3e7d8" font-weight="normal">Generator 5 · Stamin-Up</text><text x="547" y="397" font-size="28" fill="#ceb2ee" font-weight="bold">DOWN</text><circle cx="935" cy="383" r="34" fill="#151b16" stroke="#8a73a8"/><path d="M935 383l0 31" stroke="#ceb2ee" stroke-width="7" stroke-linecap="round"/><rect x="36" y="450" width="476" height="115" rx="8" fill="#20271f" stroke="#8a73a8" stroke-width="2"/><text x="55" y="482" font-size="22" fill="#e3e7d8" font-weight="normal">Church downstairs</text><text x="55" y="530" font-size="28" fill="#ceb2ee" font-weight="bold">RIGHT</text><circle cx="443" cy="516" r="34" fill="#151b16" stroke="#8a73a8"/><path d="M443 516l31 0" stroke="#ceb2ee" stroke-width="7" stroke-linecap="round"/><rect x="528" y="450" width="476" height="115" rx="8" fill="#20271f" stroke="#8a73a8" stroke-width="2"/><text x="547" y="482" font-size="22" fill="#e3e7d8" font-weight="normal">Church upstairs</text><text x="547" y="530" font-size="28" fill="#ceb2ee" font-weight="bold">UP</text><circle cx="935" cy="516" r="34" fill="#151b16" stroke="#8a73a8"/><path d="M935 516l0 -31" stroke="#ceb2ee" stroke-width="7" stroke-linecap="round"/><rect x="36" y="583" width="476" height="115" rx="8" fill="#20271f" stroke="#8a73a8" stroke-width="2"/><text x="55" y="615" font-size="22" fill="#e3e7d8" font-weight="normal">Mound wall · Church path</text><text x="55" y="663" font-size="28" fill="#ceb2ee" font-weight="bold">UP</text><circle cx="443" cy="649" r="34" fill="#151b16" stroke="#8a73a8"/><path d="M443 649l0 -31" stroke="#ceb2ee" stroke-width="7" stroke-linecap="round"/><text x="48" y="762" font-size="25" fill="#ceb2ee" font-weight="bold">Ignore the eighth panel at the top of Workshop.</text><text x="48" y="800" font-size="23" fill="#e3e7d8" font-weight="normal">Set these before or after the three Lightning piano chords.</text><text x="36" y="845" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
