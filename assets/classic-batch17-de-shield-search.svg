<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770" role="img"><title>Rocket Shield search checklist</title><rect width="1100" height="770" fill="#0b1522"/><g font-family="Arial, sans-serif"><text x="40" y="56" fill="#e8edf5" font-size="32" font-weight="700">Rocket Shield search checklist</text><text x="40" y="92" fill="#aabed0" font-size="19" font-weight="400">Find one part in each group; check all three candidate spots if needed.</text><rect x="40" y="124" width="328" height="428" rx="16" fill="#142235" stroke="#39526a"/><text x="58" y="162" fill="#e8edf5" font-size="26" font-weight="700">Fuel tanks</text><text x="58" y="191" fill="#f1bd56" font-size="15" font-weight="700">LOWER COURTYARD</text><text x="58" y="238" fill="#77cdb7" font-size="22" font-weight="700">1</text><text x="88" y="238" fill="#e8edf5" font-size="21" font-weight="400">Crates past the</text><text x="88" y="265" fill="#e8edf5" font-size="21" font-weight="400">Castle Door Trap</text><text x="58" y="338" fill="#77cdb7" font-size="22" font-weight="700">2</text><text x="88" y="338" fill="#e8edf5" font-size="21" font-weight="400">Base of the stairs</text><text x="88" y="365" fill="#e8edf5" font-size="21" font-weight="400">leading to the balconies</text><text x="58" y="438" fill="#77cdb7" font-size="22" font-weight="700">3</text><text x="88" y="438" fill="#e8edf5" font-size="21" font-weight="400">Top of the stairs</text><text x="88" y="465" fill="#e8edf5" font-size="21" font-weight="400">towards Bastion / Death Ray</text><rect x="386" y="124" width="328" height="428" rx="16" fill="#142235" stroke="#39526a"/><text x="404" y="162" fill="#e8edf5" font-size="26" font-weight="700">Body</text><text x="404" y="191" fill="#f1bd56" font-size="15" font-weight="700">UPPER COURTYARD</text><text x="404" y="238" fill="#77cdb7" font-size="22" font-weight="700">1</text><text x="434" y="238" fill="#e8edf5" font-size="21" font-weight="400">Clock Tower,</text><text x="434" y="265" fill="#e8edf5" font-size="21" font-weight="400">against the table</text><text x="404" y="338" fill="#77cdb7" font-size="22" font-weight="700">2</text><text x="434" y="338" fill="#e8edf5" font-size="21" font-weight="400">Bottom of the stairs</text><text x="434" y="365" fill="#e8edf5" font-size="21" font-weight="400">from the Clock Tower</text><text x="404" y="438" fill="#77cdb7" font-size="22" font-weight="700">3</text><text x="434" y="438" fill="#e8edf5" font-size="21" font-weight="400">Wall in front</text><text x="434" y="465" fill="#e8edf5" font-size="21" font-weight="400">of the church</text><rect x="732" y="124" width="328" height="428" rx="16" fill="#142235" stroke="#39526a"/><text x="750" y="162" fill="#e8edf5" font-size="26" font-weight="700">Top</text><text x="750" y="191" fill="#f1bd56" font-size="15" font-weight="700">UNDERCROFT — LOW GRAVITY</text><text x="750" y="238" fill="#77cdb7" font-size="22" font-weight="700">1</text><text x="780" y="238" fill="#e8edf5" font-size="21" font-weight="400">Above the pyramid,</text><text x="780" y="265" fill="#e8edf5" font-size="21" font-weight="400">on the outside railing</text><text x="750" y="338" fill="#77cdb7" font-size="22" font-weight="700">2</text><text x="780" y="338" fill="#e8edf5" font-size="21" font-weight="400">Wall above the</text><text x="780" y="365" fill="#e8edf5" font-size="21" font-weight="400">Pack-a-Punch station</text><text x="750" y="438" fill="#77cdb7" font-size="22" font-weight="700">3</text><text x="780" y="438" fill="#e8edf5" font-size="21" font-weight="400">Wall above the</text><text x="780" y="465" fill="#e8edf5" font-size="21" font-weight="400">teleporter-room entrance</text><text x="40" y="600" fill="#f1bd56" font-size="20" font-weight="700">BUILD WITH ALL THREE PARTS</text><text x="40" y="635" fill="#e8edf5" font-size="22" font-weight="400">Bench: above Double Tap, opposite the Wundersphere</text><text x="40" y="668" fill="#e8edf5" font-size="22" font-weight="400">Bench: behind the church dragon</text><text x="40" y="701" fill="#e8edf5" font-size="22" font-weight="400">Bench: Undercroft, near the pyramid</text><text x="40" y="746" fill="#aabed0" font-size="16" font-weight="400">Original search checklist • Listed spawns are alternatives, not nine separate parts</text></g></svg>