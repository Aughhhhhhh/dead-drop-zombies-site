<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#171f25"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#6d7b86"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">ALPHA OMEGA · STANDARD</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Recordings</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">Twenty archive entries</text><text x="49" y="159" fill="#e2ebec" font-size="14">Five recording families; not twenty</text><text x="49" y="177" fill="#e2ebec" font-size="14">devices</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Operations garage</text><text x="49" y="275" fill="#e2ebec" font-size="14">A player reports using the film</text><text x="49" y="293" fill="#e2ebec" font-size="14">player here</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">Green House Backyard</text><text x="49" y="391" fill="#e2ebec" font-size="14">A tape is reported beside the murky</text><text x="49" y="409" fill="#e2ebec" font-size="14">pool</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Rushmore backstory codes</text><text x="49" y="507" fill="#e2ebec" font-size="14">Read the full keypad table for its</text><text x="49" y="525" fill="#e2ebec" font-size="14">limits</text><text x="36" y="600" fill="#afc1c5" font-size="12">Partial location notes; no complete pickup</text><text x="36" y="617" fill="#afc1c5" font-size="12">census or archive assignments.</text></g></svg>
