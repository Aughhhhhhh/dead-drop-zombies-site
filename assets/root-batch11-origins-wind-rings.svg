<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820" role="img" aria-labelledby="title desc">
<title id="title">Wind Staff: fixed four-ring alignment</title><desc id="desc">The center-facing Wind row has two arrows, two L runes, one triangle, then an F rune and triangle from the inner ring outward.</desc>
<rect width="1040" height="820" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Wind Staff: fixed four-ring alignment</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><text x="48" y="149" font-size="22" fill="#e1c46d" font-weight="normal">LOOK AT THE ROW AIMED TOWARD THE CENTER OF THE CRAZY PLACE</text><text x="48" y="184" font-size="24" fill="#e3e7d8" font-weight="normal">Set the four rings from the inner circle outward.</text><rect x="36" y="215" width="968" height="101" rx="8" fill="#20271f" stroke="#b69f57" stroke-width="2"/><text x="60" y="257" font-size="24" fill="#e1c46d" font-weight="bold">1 · INNERMOST</text><text x="60" y="292" font-size="23" fill="#e3e7d8" font-weight="normal">Two one-line arrows</text><g transform="translate(795 237)" fill="none" stroke="#f0d889" stroke-width="4"><path d="M0 0v56M-8 0l16 0-8 15zM48 0v56M40 0h16l-8 15z"/></g><rect x="36" y="330" width="968" height="101" rx="8" fill="#20271f" stroke="#b69f57" stroke-width="2"/><text x="60" y="372" font-size="24" fill="#e1c46d" font-weight="bold">2 · SECOND</text><text x="60" y="407" font-size="23" fill="#e3e7d8" font-weight="normal">Two L-shaped runes</text><g transform="translate(795 352)" fill="none" stroke="#f0d889" stroke-width="4"><path d="M0 0v56h25M48 0v56h25"/></g><rect x="36" y="445" width="968" height="101" rx="8" fill="#20271f" stroke="#b69f57" stroke-width="2"/><text x="60" y="487" font-size="24" fill="#e1c46d" font-weight="bold">3 · THIRD</text><text x="60" y="522" font-size="23" fill="#e3e7d8" font-weight="normal">One triangle</text><g transform="translate(795 467)" fill="none" stroke="#f0d889" stroke-width="4"><path d="M12 0 40 28 12 56z"/></g><rect x="36" y="560" width="968" height="101" rx="8" fill="#20271f" stroke="#b69f57" stroke-width="2"/><text x="60" y="602" font-size="24" fill="#e1c46d" font-weight="bold">4 · OUTERMOST</text><text x="60" y="637" font-size="23" fill="#e3e7d8" font-weight="normal">F-shaped rune + triangle</text><g transform="translate(795 582)" fill="none" stroke="#f0d889" stroke-width="4"><path d="M0 56V0h30M0 27h24M50 0l28 28-28 28z"/></g><text x="48" y="714" font-size="22" fill="#e3e7d8" font-weight="normal">Schematic glyphs: the real carvings follow the curve of each ring.</text><text x="48" y="750" font-size="22" fill="#e3e7d8" font-weight="normal">Shoot a ring with the Wind Staff to rotate it. Wait for confirmation.</text><text x="36" y="795" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
