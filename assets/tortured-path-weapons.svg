<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#19272d"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#718d94"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">THE TORTURED PATH</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Objective weapons</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">Random wall buys</text><text x="49" y="159" fill="#e2ebec" font-size="14">Read the reported weapon guarantees</text><text x="49" y="177" fill="#e2ebec" font-size="14">and their limits</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Pack-a-Punch</text><text x="49" y="275" fill="#e2ebec" font-size="14">Each chapter uses batteries on Waves</text><text x="49" y="293" fill="#e2ebec" font-size="14">1, 4 and 7</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">The Classic PPSh-41</text><text x="49" y="391" fill="#e2ebec" font-size="14">A reported resupply-flare chance</text><text x="49" y="409" fill="#e2ebec" font-size="14">costs 1,750 Jolts</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Sword and upgrades</text><text x="49" y="507" fill="#e2ebec" font-size="14">Follow the quest and check version-</text><text x="49" y="525" fill="#e2ebec" font-size="14">specific rewards</text><text x="36" y="600" fill="#afc1c5" font-size="12">Complete current weapon pools and upgrade</text><text x="36" y="617" fill="#afc1c5" font-size="12">rules remain unverified.</text></g></svg>
