<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#171f25"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#6d7b86"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">TAG DER TOTEN · CLASSIC</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Extra campfire song</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">Story ritual</text><text x="49" y="159" fill="#e2ebec" font-size="14">Use the Seal and Samantha’s Music Box at</text><text x="49" y="177" fill="#e2ebec" font-size="14">the Sunken Path fire.</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Wait</text><text x="49" y="275" fill="#e2ebec" font-size="14">Allow the normal ritual dialogue to</text><text x="49" y="293" fill="#e2ebec" font-size="14">finish.</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">Interact again</text><text x="49" y="391" fill="#e2ebec" font-size="14">The author reports a few extra</text><text x="49" y="409" fill="#e2ebec" font-size="14">interactions at the same fire.</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Optional song</text><text x="49" y="507" fill="#e2ebec" font-size="14">Continue the story using its objective</text><text x="49" y="525" fill="#e2ebec" font-size="14">cues after listening.</text><text x="36" y="600" fill="#afc1c5" font-size="12">Exact count, ritual timing and replay conditions</text><text x="36" y="617" fill="#afc1c5" font-size="12">remain unverified.</text></g></svg>
