<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#1b1712"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#786448"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#e3b477" font-size="12" letter-spacing="2">IX · CLASSIC</text><text x="36" y="86" fill="#faf2e7" font-size="24" font-weight="700">Ordinary gun upgrades</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#2c241b"/><text x="49" y="136" fill="#ebca98" font-size="17" font-weight="700">Open Pack-a-Punch</text><text x="49" y="157" fill="#e9e0d3" font-size="14">Collect four tower heads</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#2c241b"/><text x="49" y="252" fill="#ebca98" font-size="17" font-weight="700">First upgrade</text><text x="49" y="273" fill="#e9e0d3" font-size="14">5,000 points</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#2c241b"/><text x="49" y="368" fill="#ebca98" font-size="17" font-weight="700">Four damage upgrades</text><text x="49" y="389" fill="#e9e0d3" font-size="14">2,500 points each</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#2c241b"/><text x="49" y="484" fill="#ebca98" font-size="17" font-weight="700">Later re-packs</text><text x="49" y="505" fill="#e9e0d3" font-size="14">1,500 points changes the ammo type</text><text x="36" y="600" fill="#c2b39d" font-size="12">Historical player reports; read the live</text><text x="36" y="617" fill="#c2b39d" font-size="12">prompt. Special-weapon parity is not</text><text x="36" y="634" fill="#c2b39d" font-size="12">established.</text></g></svg>
