<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 775" role="img" aria-labelledby="title desc">
<title id="title">One Inch Punch: four soul-chest areas</title><desc id="desc">The four soul chests are near Generator 4, below excavation, near Generator 5 and on the Church approach. They sit in giant footprints and unfinished progress resets after a stomp.</desc>
<rect width="1040" height="775" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">One Inch Punch: four soul-chest areas</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><text x="48" y="149" font-size="25" fill="#acbca1" font-weight="normal">FOUR LARGE CHESTS IN GIANT ROBOT FOOTPRINTS</text><rect x="36" y="187" width="476" height="154" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="236" font-size="27" fill="#c1cfab" font-weight="bold">GENERATOR 4</text><text x="58" y="286" font-size="21" fill="#e3e7d8" font-weight="normal">Juggernog-side footprint</text><rect x="528" y="187" width="476" height="154" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="550" y="236" font-size="27" fill="#c1cfab" font-weight="bold">EXCAVATION</text><text x="550" y="286" font-size="21" fill="#e3e7d8" font-weight="normal">Central footprint below the mound</text><rect x="36" y="361" width="476" height="154" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="410" font-size="27" fill="#c1cfab" font-weight="bold">GENERATOR 5</text><text x="58" y="460" font-size="21" fill="#e3e7d8" font-weight="normal">Stamin-Up-side footprint</text><rect x="528" y="361" width="476" height="154" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="550" y="410" font-size="27" fill="#c1cfab" font-weight="bold">CHURCH</text><text x="550" y="460" font-size="21" fill="#e3e7d8" font-weight="normal">Footprint outside the Church approach</text><text x="48" y="602" font-size="26" fill="#e3e7d8" font-weight="normal">Kill close enough that souls enter the open chest.</text><text x="48" y="649" font-size="24" fill="#e3e7d8" font-weight="normal">A stomp resets an unfinished chest. Start after the robot passes.</text><text x="48" y="696" font-size="25" fill="#e3e7d8" font-weight="normal">After all four finish, each player claims One Inch Punch.</text><text x="36" y="750" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
