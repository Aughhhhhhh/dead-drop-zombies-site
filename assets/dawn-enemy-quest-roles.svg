<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600"><rect width="420" height="600" fill="#101b22"/><rect x="18" y="18" width="384" height="564" rx="12" fill="none" stroke="#496b79"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#8bd4df" font-size="12" letter-spacing="2">THE FROZEN DAWN</text><text x="36" y="86" fill="#f1f7f8" font-size="25" font-weight="700">Enemies used in quests</text><rect x="35" y="112" width="350" height="91" rx="7" fill="#1b2b34"/><text x="49" y="136" fill="#a7e2cb" font-size="18" font-weight="700">Pest</text><text x="49" y="157" fill="#d6e3e7" font-size="15">Reported possession target</text><rect x="35" y="213" width="350" height="91" rx="7" fill="#1b2b34"/><text x="49" y="237" fill="#a7e2cb" font-size="18" font-weight="700">Wüstling</text><text x="49" y="258" fill="#d6e3e7" font-size="15">Shield quest uses a specific carrier</text><rect x="35" y="314" width="350" height="91" rx="7" fill="#1b2b34"/><text x="49" y="338" fill="#a7e2cb" font-size="18" font-weight="700">Bomber</text><text x="49" y="359" fill="#d6e3e7" font-size="15">Explosive opens the Shield-route</text><text x="49" y="378" fill="#d6e3e7" font-size="15">door</text><rect x="35" y="415" width="350" height="91" rx="7" fill="#1b2b34"/><text x="49" y="439" fill="#a7e2cb" font-size="18" font-weight="700">Corpse Eater</text><text x="49" y="460" fill="#d6e3e7" font-size="15">Scythe / Shield / Hammer roles</text><text x="36" y="546" fill="#a6bec8" font-size="12">Original quest-role summary, not enemy photos.</text><text x="36" y="564" fill="#a6bec8" font-size="12">Follow each card’s required enemy state.</text></g></svg>
