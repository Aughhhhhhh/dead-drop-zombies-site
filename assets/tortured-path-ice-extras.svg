<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#19272d"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#718d94"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">THE TORTURED PATH</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Beneath the Ice</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">Blitz locations</text><text x="49" y="159" fill="#e2ebec" font-size="14">Seven historical entries; read the</text><text x="49" y="177" fill="#e2ebec" font-size="14">source table</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Special enemies</text><text x="49" y="275" fill="#e2ebec" font-size="14">Six descriptions and the chapter</text><text x="49" y="293" fill="#e2ebec" font-size="14">boss notes</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">Recording</text><text x="49" y="391" fill="#e2ebec" font-size="14">One chapter pickup; check the</text><text x="49" y="409" fill="#e2ebec" font-size="14">account restriction</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Chapter quest</text><text x="49" y="507" fill="#e2ebec" font-size="14">Read runes, assemble the Sword and</text><text x="49" y="525" fill="#e2ebec" font-size="14">fight the Guardian</text><text x="36" y="600" fill="#afc1c5" font-size="12">Objective chapter reference. Separate Survival</text><text x="36" y="617" fill="#afc1c5" font-size="12">rules may differ.</text></g></svg>
