<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#171f25"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#6d7b86"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">ALPHA OMEGA · STANDARD</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Regular Mark II</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">Mystery Box</text><text x="49" y="159" fill="#e2ebec" font-size="14">The non-elemental gun is a separate</text><text x="49" y="177" fill="#e2ebec" font-size="14">acquisition</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Clock-puzzle case</text><text x="49" y="275" fill="#e2ebec" font-size="14">Read the conflicting reports about</text><text x="49" y="293" fill="#e2ebec" font-size="14">the free gun</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">Porter’s Mark II</text><text x="49" y="391" fill="#e2ebec" font-size="14">Pack the regular gun at the machine</text><text x="49" y="409" fill="#e2ebec" font-size="14">in Beds</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Four experiments</text><text x="49" y="507" fill="#e2ebec" font-size="14">V, X, Y and Z use their own Frames</text><text x="49" y="525" fill="#e2ebec" font-size="14">and canisters</text><text x="36" y="600" fill="#afc1c5" font-size="12">Use the written route for prerequisites,</text><text x="36" y="617" fill="#afc1c5" font-size="12">source conflicts and mode limits.</text></g></svg>
