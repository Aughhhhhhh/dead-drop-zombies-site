<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">Zetsubou No Shima elevator cogs</title><desc id="d">Three cog acquisition routes and the elevator machinery.</desc><rect width="1400" height="800" fill="#090909"/><text x="700" y="55" fill="#fff" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">THE THREE ELEVATOR COGS</text><g font-family="Arial"><rect x="55" y="110" width="390" height="430" rx="26" fill="#151515" stroke="#a775ff" stroke-width="5"/><text x="250" y="160" fill="#a775ff" font-size="31" text-anchor="middle" font-weight="700">COG 1 · GOBBLEGUM</text><text x="95" y="220" fill="#fff" font-size="24">• Equip Anywhere But Here! before match</text><text x="95" y="275" fill="#fff" font-size="24">• Stand in sealed chamber below Lab A</text><text x="95" y="330" fill="#fff" font-size="24">• Activate gum → secret room above Lab A</text><text x="95" y="385" fill="#fff" font-size="24">• Take cog and use one-way exit</text><rect x="505" y="110" width="390" height="430" rx="26" fill="#151515" stroke="#79b8ff" stroke-width="5"/><text x="700" y="160" fill="#79b8ff" font-size="31" text-anchor="middle" font-weight="700">COG 2 · ZIPLINE</text><text x="545" y="220" fill="#fff" font-size="24">• Catch lightning on Zombie Shield</text><text x="545" y="275" fill="#fff" font-size="24">• Shock Lab A zipline panel</text><text x="545" y="330" fill="#fff" font-size="24">• Ride upward from Docks</text><text x="545" y="385" fill="#fff" font-size="24">• Melee early → drop to side dock</text><rect x="955" y="110" width="390" height="430" rx="26" fill="#151515" stroke="#d96b3c" stroke-width="5"/><text x="1150" y="160" fill="#d96b3c" font-size="31" text-anchor="middle" font-weight="700">COG 3 · AA GUN</text><text x="995" y="220" fill="#fff" font-size="24">• Grow blue-water plants for 3 rounds</text><text x="995" y="275" fill="#fff" font-size="24">• KT-4 shoot plant once each round</text><text x="995" y="330" fill="#fff" font-size="24">• Collect chance-drop Flak Shell</text><text x="995" y="385" fill="#fff" font-size="24">• Load AA gun · shoot plane · find smoke</text><path d="M250 540C300 625 480 630 590 645M700 540v105M1150 540C1100 625 920 630 810 645" stroke="#f5b078" stroke-width="7" fill="none"/><rect x="455" y="625" width="490" height="105" rx="24" fill="#151515" stroke="#f5b078" stroke-width="5"/><text x="700" y="670" fill="#fff" font-size="30" text-anchor="middle" font-weight="700">INSTALL IN HIDDEN ELEVATOR MACHINE</text><text x="700" y="705" fill="#aaa" font-size="21" text-anchor="middle">Reveal wall with Skull of Nan Sapwe.</text></g></svg>