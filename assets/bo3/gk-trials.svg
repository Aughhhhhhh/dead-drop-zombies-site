<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" role="img" aria-labelledby="t d"><title id="t">Gorod Krovi S.O.P.H.I.A. trials</title><desc id="d">The six random trials and their key failure conditions.</desc><rect width="1500" height="860" fill="#090909"/><text x="750" y="55" fill="#fff" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">S.O.P.H.I.A. TRIALS · RANDOM ORDER</text><g font-family="Arial"><g fill="#151515" stroke="#d96b3c" stroke-width="4"><rect x="55" y="105" width="430" height="190" rx="24"/><rect x="535" y="105" width="430" height="190" rx="24"/><rect x="1015" y="105" width="430" height="190" rx="24"/><rect x="55" y="345" width="430" height="190" rx="24"/><rect x="535" y="345" width="430" height="190" rx="24"/><rect x="1015" y="345" width="430" height="190" rx="24"/></g><g fill="#fff"><text x="270" y="150" font-size="29" text-anchor="middle" font-weight="700">BOMB SEQUENCE</text><text x="95" y="200" font-size="23">Record all 6 monitor flashes.</text><text x="95" y="240" font-size="23">Defuse in exact order within 2 min.</text><text x="750" y="150" font-size="29" text-anchor="middle" font-weight="700">VALKYRIE ESCORT</text><text x="575" y="200" font-size="23">Spawn → Dragon Command pad.</text><text x="575" y="240" font-size="23">Do not destroy the green-eyed drone.</text><text x="1230" y="150" font-size="29" text-anchor="middle" font-weight="700">MANGLER ESCORT</text><text x="1055" y="200" font-size="23">Tank Factory → Dragon Command.</text><text x="1055" y="240" font-size="23">Shoot cannon arm, not the body.</text><text x="270" y="390" font-size="29" text-anchor="middle" font-weight="700">GERSH ORB</text><text x="95" y="440" font-size="23">Track yellow orb and shoot each stop.</text><text x="95" y="480" font-size="23">Finish when it asks you to stop.</text><text x="750" y="390" font-size="29" text-anchor="middle" font-weight="700">GROPH CARGO</text><text x="575" y="440" font-size="23">Find outside pod, clear enemies.</text><text x="575" y="480" font-size="23">Use Gauntlet dragon, return cargo.</text><text x="1230" y="390" font-size="29" text-anchor="middle" font-weight="700">KILL / LOCKDOWN</text><text x="1055" y="440" font-size="23">Complete the assigned combat trial.</text><text x="1055" y="480" font-size="23">Stay in the active area.</text></g><rect x="245" y="625" width="1010" height="120" rx="24" fill="#151515" stroke="#a775ff" stroke-width="5"/><text x="750" y="675" fill="#a775ff" text-anchor="middle" font-size="30" font-weight="700">BOMBS ARE THE LETHAL FAILURE POINT</text><text x="750" y="715" fill="#fff" text-anchor="middle" font-size="23">Write all six locations before anyone touches the first bomb.</text><text x="750" y="810" fill="#aaa" text-anchor="middle" font-size="22">Enter KRONOS before starting trials.</text></g></svg>