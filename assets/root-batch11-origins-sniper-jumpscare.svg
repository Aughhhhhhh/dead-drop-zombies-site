<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 536" role="img" aria-labelledby="title desc">
<title id="title">Sniper jumpscare: aim from the mound</title><desc id="desc">The Church-tower jumpscare requires a scoped sniper sight line from the top of the Excavation Site.</desc>
<rect width="1040" height="536" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Sniper jumpscare: aim from the mound</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><rect x="36" y="139" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="170" font-size="23" fill="#c1cfab" font-weight="bold">EQUIP · A NORMAL SNIPER SCOPE</text><text x="58" y="202" font-size="22" fill="#e3e7d8" font-weight="normal">Use a scoped rifle rather than a staff or an iron sight.</text><rect x="36" y="235" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="266" font-size="23" fill="#c1cfab" font-weight="bold">STAND · TOP OF EXCAVATION</text><text x="58" y="298" font-size="22" fill="#e3e7d8" font-weight="normal">Face the Church and keep space behind you for the zombies.</text><rect x="36" y="331" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="362" font-size="23" fill="#c1cfab" font-weight="bold">LOOK · BURNING TOWER TOP</text><text x="58" y="394" font-size="22" fill="#e3e7d8" font-weight="normal">Hold the normal scope on the fire until the face and scream trigger.</text><text x="48" y="469" font-size="22" fill="#e3e7d8" font-weight="normal">This is an optional visual and audio secret, with no separate weapon reward.</text><text x="36" y="511" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
