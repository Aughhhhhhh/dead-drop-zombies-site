<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#19181f"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#716480"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c5b8d5" font-size="12" letter-spacing="2">DEAD OF THE NIGHT · CLASSIC</text><text x="36" y="86" fill="#f4eff5" font-size="24" font-weight="700">Weapon reference</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#2e2736"/><text x="49" y="137" fill="#d6c4dc" font-size="17" font-weight="700">36 recorded base rows</text><text x="49" y="159" fill="#ede3ef" font-size="14">Acquisitions, prices and packed</text><text x="49" y="177" fill="#ede3ef" font-size="14">names</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#2e2736"/><text x="49" y="253" fill="#d6c4dc" font-size="17" font-weight="700">17 later acquisitions</text><text x="49" y="275" fill="#ede3ef" font-size="14">Read the dated 2019 Box listings</text><text x="49" y="293" fill="#ede3ef" font-size="14">separately</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#2e2736"/><text x="49" y="369" fill="#d6c4dc" font-size="17" font-weight="700">Special weapons</text><text x="49" y="391" fill="#ede3ef" font-size="14">Use the Folly, Stake and Impaler</text><text x="49" y="409" fill="#ede3ef" font-size="14">quests</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#2e2736"/><text x="49" y="485" fill="#d6c4dc" font-size="17" font-weight="700">Silver and reserve ammo</text><text x="49" y="507" fill="#ede3ef" font-size="14">Paid refills and the ghost reward</text><text x="49" y="525" fill="#ede3ef" font-size="14">have different rules</text><text x="36" y="600" fill="#bdb0c3" font-size="12">Historical tables; final-build pools and later</text><text x="36" y="617" fill="#bdb0c3" font-size="12">packed aliases remain unchecked.</text></g></svg>
