<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc">
<title id="title">G-Strike tablets: clean, carry, charge</title><desc id="desc">The two soul charges and dry carry are separate G-Strike objectives, with a basin reset if the clean tablet touches mud.</desc>
<rect width="1040" height="728" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">G-Strike tablets: clean, carry, charge</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><rect x="36" y="139" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="170" font-size="23" fill="#c1cfab" font-weight="bold">TAKE · GENERATOR 2</text><text x="58" y="202" font-size="22" fill="#e3e7d8" font-weight="normal">Pick up a tablet from the Tank Station’s rear table.</text><rect x="36" y="235" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="266" font-size="23" fill="#c1cfab" font-weight="bold">CLEAN · UPPER CHURCH</text><text x="58" y="298" font-size="22" fill="#e3e7d8" font-weight="normal">Put it in the basin. Feed nearby melee souls until it is ready.</text><rect x="36" y="331" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="362" font-size="23" fill="#c1cfab" font-weight="bold">CARRY · DRY BOARDS</text><text x="58" y="394" font-size="22" fill="#e3e7d8" font-weight="normal">Take it back via raised walkways, Workshop and the trench boards.</text><rect x="36" y="427" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="458" font-size="23" fill="#c1cfab" font-weight="bold">MUD FAILURE · RETURN TO THE BASIN</text><text x="58" y="490" font-size="22" fill="#e3e7d8" font-weight="normal">Re-clean the tablet, then try the dry carry again.</text><rect x="36" y="523" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="554" font-size="23" fill="#c1cfab" font-weight="bold">CHARGE · ORIGINAL TABLE</text><text x="58" y="586" font-size="22" fill="#e3e7d8" font-weight="normal">Place it back at Generator 2. Feed more melee souls and take G-Strikes.</text><text x="48" y="661" font-size="22" fill="#e3e7d8" font-weight="normal">G-Strikes use the tactical slot; keep a beacon ready for Rain Fire.</text><text x="36" y="703" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
