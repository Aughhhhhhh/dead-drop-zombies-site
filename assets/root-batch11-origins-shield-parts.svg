<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc">
<title id="title">Zombie Shield: one part from each search group</title><desc id="desc">Three Zombie Shield search groups with three possible positions each, followed by the three available workbench areas.</desc>
<rect width="1040" height="728" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Zombie Shield: one part from each search group</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><rect x="36" y="139" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="170" font-size="23" fill="#c1cfab" font-weight="bold">GENERATOR 3 GROUP · THREE POSITIONS</text><text x="58" y="202" font-size="22" fill="#e3e7d8" font-weight="normal">Brown crate by AK74u; spawn-route side room; bottom of Fire tunnel.</text><rect x="36" y="235" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="266" font-size="23" fill="#c1cfab" font-weight="bold">GENERATOR 2 GROUP · THREE POSITIONS</text><text x="58" y="298" font-size="22" fill="#e3e7d8" font-weight="normal">Tank Station roof pipe; dead-end trench; spawn-route side room.</text><rect x="36" y="331" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="362" font-size="23" fill="#c1cfab" font-weight="bold">ODIN’S RIGHT-FOOT GROUP · THREE POSITIONS</text><text x="58" y="394" font-size="22" fill="#e3e7d8" font-weight="normal">Footprints by Juggernog, excavation and the Church approach.</text><rect x="36" y="427" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="458" font-size="23" fill="#c1cfab" font-weight="bold">BUILD · CHOOSE ONE FREE BENCH</text><text x="58" y="490" font-size="22" fill="#e3e7d8" font-weight="normal">Lower Workshop, Wind tunnel or lower Church.</text><rect x="36" y="523" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="554" font-size="23" fill="#c1cfab" font-weight="bold">REPLACE · RETURN TO THE SAME BENCH</text><text x="58" y="586" font-size="22" fill="#e3e7d8" font-weight="normal">Take a fresh shield after the previous one breaks.</text><text x="48" y="661" font-size="22" fill="#e3e7d8" font-weight="normal">These are search groups, not nine parts: collect one part from each group.</text><text x="36" y="703" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
