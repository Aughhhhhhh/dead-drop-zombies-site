<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" role="img" aria-labelledby="title desc">
  <title id="title">Four clover donations</title>
  <desc id="desc">Historical 2018 clover hunt: four successful donations of 250 Jolts cost 1,000 Jolts. A rainbow confirms each donation. Check the camo notification after the fourth.</desc>
  <defs>
    <g id="clover" fill="#8aba76">
      <path d="M0 5Q1 22-8 34" fill="none" stroke="#8aba76" stroke-width="4"/>
      <circle cx="-11" cy="-11" r="13"/><circle cx="11" cy="-11" r="13"/>
      <circle cx="-11" cy="11" r="13"/><circle cx="11" cy="11" r="13"/>
    </g>
  </defs>
  <rect width="420" height="600" rx="12" fill="#131610"/>
  <g font-family="Arial, sans-serif" fill="#e7eadf">
    <text x="28" y="35" font-size="15" letter-spacing="2" fill="#b5bc8f">2018 HISTORICAL EVENT</text>
    <text x="28" y="72" font-size="29" font-weight="700">Four clover donations</text>
    <text x="28" y="103" font-size="18" fill="#b8c0af">Use Share Jolts on each clover.</text>
    <g font-size="16" fill="#b8c0af">
      <text x="98" y="143">Donation 1</text><text x="98" y="228">Donation 2</text>
      <text x="98" y="313">Donation 3</text><text x="98" y="398">Donation 4</text>
    </g>
    <g font-size="27" font-weight="700">
      <text x="98" y="174">250 Jolts</text><text x="98" y="259">250 Jolts</text>
      <text x="98" y="344">250 Jolts</text><text x="98" y="429">250 Jolts</text>
    </g>
    <path d="M28 452H392" stroke="#4f5a3e"/>
    <text x="28" y="492" font-size="28" font-weight="700" fill="#c9d59d">1,000 Jolts total</text>
    <text x="28" y="531" font-size="19">Rainbow = donation accepted.</text>
    <text x="28" y="563" font-size="18" fill="#b8c0af">After four: check the camo notification.</text>
    <text x="28" y="588" font-size="15" fill="#b8c0af">Diagram only. Spawn positions vary.</text>
  </g>
  <use href="#clover" x="55" y="156"/><use href="#clover" x="55" y="241"/>
  <use href="#clover" x="55" y="326"/><use href="#clover" x="55" y="411"/>
</svg>
