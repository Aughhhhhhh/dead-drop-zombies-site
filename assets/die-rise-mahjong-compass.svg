<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
<title id="title">Die Rise Mahjong tower orientation</title>
<desc id="desc">Rotate North to the tower corner bearing the direction tile. East, South and West follow clockwise. Match direction and number tiles by colour, then punch the decoded order.</desc>
<rect width="640" height="760" rx="20" fill="#141c22"/>
<g fill="#f3eee3" font-family="Arial, sans-serif">
<text x="40" y="60" font-size="32" font-weight="bold">MAHJONG TOWER COMPASS</text>
<text x="40" y="103" font-size="23" fill="#a7b5bc">Clockwise: N → E → S → W</text>
</g>
<path d="M320 207L463 350L320 493L177 350Z" fill="#26343c" stroke="#768c97" stroke-width="4"/>
<path d="M380 195Q520 230 520 320" fill="none" stroke="#e6a64a" stroke-width="6"/>
<path d="M509 306L520 330L532 307" fill="none" stroke="#e6a64a" stroke-width="6"/>
<g font-family="Arial, sans-serif" font-size="31" fill="#f3eee3" text-anchor="middle">
<text x="320" y="179">N · 北</text><text x="535" y="365">E · 東</text>
<text x="320" y="540">S · 南</text><text x="105" y="365">W · 西</text>
<text x="320" y="337" font-size="25">Rotate N to the</text>
<text x="320" y="373" font-size="25">tile-bearing corner</text>
</g>
<g font-family="Arial, sans-serif" fill="#f3eee3" font-size="25">
<text x="40" y="600">1  Find 8 tiles at the 11 checks.</text>
<text x="40" y="644">2  Match direction/number tile colours.</text>
<text x="40" y="688">3  Write the directions in order 1–4.</text>
<text x="40" y="732">4  Punch each decoded corner once.</text>
</g></svg>
