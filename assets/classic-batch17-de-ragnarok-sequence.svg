<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img"><title>Ragnarok DG-4: three parts</title><rect width="1100" height="680" fill="#0b1522"/><g font-family="Arial, sans-serif"><text x="40" y="56" fill="#e8edf5" font-size="32" font-weight="700">Ragnarok DG-4: three parts</text><text x="40" y="92" fill="#aabed0" font-size="19" font-weight="400">Collect every component, then build and take the specialist at a workbench.</text><rect x="40" y="130" width="328" height="374" rx="16" fill="#142235" stroke="#39526a"/><text x="58" y="173" fill="#f1bd56" font-size="24" font-weight="700">PANZER DROP</text><text x="58" y="226" fill="#e8edf5" font-size="20" font-weight="400">Kill a Panzersoldat.</text><text x="58" y="266" fill="#e8edf5" font-size="20" font-weight="400">Pick up its component.</text><rect x="386" y="130" width="328" height="374" rx="16" fill="#142235" stroke="#39526a"/><text x="404" y="173" fill="#f1bd56" font-size="24" font-weight="700">DEATH RAY</text><text x="404" y="226" fill="#e8edf5" font-size="20" font-weight="400">Activate the Death Ray.</text><text x="404" y="266" fill="#e8edf5" font-size="20" font-weight="400">Find the blue part in the sky.</text><text x="404" y="306" fill="#e8edf5" font-size="20" font-weight="400">Use the matching</text><text x="404" y="346" fill="#e8edf5" font-size="20" font-weight="400">castle Wundersphere.</text><text x="404" y="386" fill="#e8edf5" font-size="20" font-weight="400">Fly through the part.</text><rect x="732" y="130" width="328" height="374" rx="16" fill="#142235" stroke="#39526a"/><text x="750" y="173" fill="#f1bd56" font-size="24" font-weight="700">ROCKET TEST</text><text x="750" y="226" fill="#e8edf5" font-size="20" font-weight="400">Use the outside lever</text><text x="750" y="266" fill="#e8edf5" font-size="20" font-weight="400">under the stairs.</text><text x="750" y="306" fill="#e8edf5" font-size="20" font-weight="400">Get into the tunnel.</text><text x="750" y="346" fill="#e8edf5" font-size="20" font-weight="400">Wait for three green bulbs.</text><text x="750" y="386" fill="#e8edf5" font-size="20" font-weight="400">Use the inside panel.</text><text x="750" y="426" fill="#e8edf5" font-size="20" font-weight="400">Take the part in the teleporter.</text><text x="40" y="555" fill="#e8edf5" font-size="22" font-weight="400">Rocket sequence: outside lever → shelter → three greens → inside panel → pickup</text><text x="40" y="599" fill="#e8edf5" font-size="22" font-weight="400">Build with all three parts. Planting and slamming are different attacks.</text><text x="40" y="656" fill="#aabed0" font-size="16" font-weight="400">Original diagram • Not a floor plan</text></g></svg>