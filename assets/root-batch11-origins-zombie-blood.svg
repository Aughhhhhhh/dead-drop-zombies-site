<title id="title">Free Zombie Blood: extinguish three carts</title><desc id="desc">Three burning-cart landmarks for the Ice Staff reward, with the Zombie Blood collection point beside Pack-a-Punch.</desc>
<rect width="1040" height="632" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Free Zombie Blood: extinguish three carts</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><rect x="36" y="139" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="170" font-size="23" fill="#c1cfab" font-weight="bold">CART · GENERATOR 4</text><text x="58" y="202" font-size="22" fill="#e3e7d8" font-weight="normal">Burning wooden cart in the Juggernog-side robot footprint.</text><rect x="36" y="235" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="266" font-size="23" fill="#c1cfab" font-weight="bold">CART · GENERATOR 5</text><text x="58" y="298" font-size="22" fill="#e3e7d8" font-weight="normal">Burning cart on the Stamin-Up approach.</text><rect x="36" y="331" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="362" font-size="23" fill="#c1cfab" font-weight="bold">CART · EXCAVATION SIGN</text><text x="58" y="394" font-size="22" fill="#e3e7d8" font-weight="normal">Burning cart on the spawn-facing MP40 approach to the mound.</text><rect x="36" y="427" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="458" font-size="23" fill="#c1cfab" font-weight="bold">COLLECT · TOP OF THE MOUND</text><text x="58" y="490" font-size="22" fill="#e3e7d8" font-weight="normal">Use the Ice Staff on all three, then take the drop by Pack-a-Punch.</text><text x="48" y="565" font-size="22" fill="#e3e7d8" font-weight="normal">Finish before earlier fires relight; prepare the next task before collecting.</text><text x="36" y="607" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
