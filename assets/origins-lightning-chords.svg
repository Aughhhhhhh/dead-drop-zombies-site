<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Origins Lightning Staff chord reference</title><desc id="desc">Number the seven bottom row triangles from left to right. Shoot 1 3 6, wait; shoot 3 5 7, wait; shoot 2 4 6. Do not shoot the upper row.</desc>
<rect width="1200" height="690" fill="#151810"/><g font-family="Arial,sans-serif" fill="#e9ecdf"><text x="55" y="63" font-size="18" fill="#cf7a3c" letter-spacing="3">ORIGINS / LIGHTNING STAFF</text><text x="55" y="120" font-size="42" font-weight="bold">Three chords. Only the lower row.</text><text x="55" y="160" font-size="22" fill="#b6bba8">Count the seven lower triangles from LEFT to RIGHT. Wait for each chord to register.</text><polygon points="120,210 80,280 160,280" fill="#29273d" stroke="#b8a3e1" stroke-width="3"/><text x="120" y="318" font-size="26" text-anchor="middle">1</text><polygon points="272,210 232,280 312,280" fill="#29273d" stroke="#b8a3e1" stroke-width="3"/><text x="272" y="318" font-size="26" text-anchor="middle">2</text><polygon points="424,210 384,280 464,280" fill="#29273d" stroke="#b8a3e1" stroke-width="3"/><text x="424" y="318" font-size="26" text-anchor="middle">3</text><polygon points="576,210 536,280 616,280" fill="#29273d" stroke="#b8a3e1" stroke-width="3"/><text x="576" y="318" font-size="26" text-anchor="middle">4</text><polygon points="728,210 688,280 768,280" fill="#29273d" stroke="#b8a3e1" stroke-width="3"/><text x="728" y="318" font-size="26" text-anchor="middle">5</text><polygon points="880,210 840,280 920,280" fill="#29273d" stroke="#b8a3e1" stroke-width="3"/><text x="880" y="318" font-size="26" text-anchor="middle">6</text><polygon points="1032,210 992,280 1072,280" fill="#29273d" stroke="#b8a3e1" stroke-width="3"/><text x="1032" y="318" font-size="26" text-anchor="middle">7</text><rect x="55" y="377" width="350" height="165" rx="7" fill="#22271b"/><text x="80" y="417" font-size="20" fill="#cf7a3c">CHORD 1</text><text x="80" y="483" font-size="42" font-weight="bold">1  →  3  →  6</text><text x="80" y="518" font-size="18" fill="#b6bba8">Shoot, then wait for confirmation.</text><rect x="425" y="377" width="350" height="165" rx="7" fill="#22271b"/><text x="450" y="417" font-size="20" fill="#cf7a3c">CHORD 2</text><text x="450" y="483" font-size="42" font-weight="bold">3  →  5  →  7</text><text x="450" y="518" font-size="18" fill="#b6bba8">Shoot, then wait for confirmation.</text><rect x="795" y="377" width="350" height="165" rx="7" fill="#22271b"/><text x="820" y="417" font-size="20" fill="#cf7a3c">CHORD 3</text><text x="820" y="483" font-size="42" font-weight="bold">2  →  4  →  6</text><text x="820" y="518" font-size="18" fill="#b6bba8">Shoot, then wait for confirmation.</text><text x="55" y="596" font-size="23">Use the Lightning Staff. Ignore the upper triangles.</text><text x="55" y="637" font-size="18" fill="#9ca28f">Original schematic based on the community guide. Next: electrical panels, purple rings, then Crazy Place souls.</text></g></svg>