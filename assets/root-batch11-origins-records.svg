<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" role="img" aria-labelledby="title desc">
<title id="title">Five records: where to search and where to use them</title><desc id="desc">Five record colors with separate search areas and matching Gramophone portal destinations. The plain record opens the staff chamber.</desc>
