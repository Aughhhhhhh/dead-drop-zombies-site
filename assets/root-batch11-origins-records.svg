ont-weight="normal">Generator 5 · Stamin-Up area</text><text x="582" y="429" font-size="23" fill="#e3e7d8" font-weight="normal">Wind tunnel · Generator 4</text><rect x="36" y="478" width="968" height="90" rx="8" fill="#20271f" stroke="#bc9ade" stroke-width="2"/><circle cx="78" cy="521" r="24" fill="none" stroke="#bc9ade" stroke-width="7"/><circle cx="78" cy="521" r="5" fill="#bc9ade"/><text x="121" y="509" font-size="18" fill="#bc9ade" font-weight="bold">PURPLE</text><text x="121" y="542" font-size="23" fill="#e3e7d8" font-weight="normal">Generator 4 · Juggernog area</text><text x="582" y="533" font-size="23" fill="#e3e7d8" font-weight="normal">Lightning tunnel · Generator 5</text><rect x="36" y="582" width="968" height="90" rx="8" fill="#20271f" stroke="#e29d83" stroke-width="2"/><circle cx="78" cy="625" r="24" fill="none" stroke="#e29d83" stroke-width="7"/><circle cx="78" cy="625" r="5" fill="#e29d83"/><text x="121" y="613" font-size="18" fill="#e29d83" font-weight="bold">RED</text><text x="121" y="646" font-size="23" fill="#e3e7d8" font-weight="normal">Church · Generator 6 area</text><text x="582" y="637" font-size="23" fill="#e3e7d8" font-weight="normal">Fire tunnel · Generator 3</text><text x="48" y="731" font-size="24" fill="#e3e7d8" font-weight="normal">Pick the Gramophone back up before moving to another tunnel.</text><text x="36" y="775" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
