<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#1b1712"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#786448"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#e3b477" font-size="12" letter-spacing="2">IX · CLASSIC</text><text x="36" y="86" fill="#faf2e7" font-size="24" font-weight="700">Iron Bull route</text><rect x="35" y="112" width="350" height="56" rx="7" fill="#2c241b"/><text x="49" y="136" fill="#ebca98" font-size="17" font-weight="700">1  Zeus bull heads</text><text x="49" y="157" fill="#e9e0d3" font-size="14">Shield ranged attack</text><rect x="35" y="178" width="350" height="56" rx="7" fill="#2c241b"/><text x="49" y="202" fill="#ebca98" font-size="17" font-weight="700">2  Temple</text><text x="49" y="223" fill="#e9e0d3" font-size="14">Shoot down and take the first part</text><rect x="35" y="244" width="350" height="56" rx="7" fill="#2c241b"/><text x="49" y="268" fill="#ebca98" font-size="17" font-weight="700">3  Four ignitions</text><text x="49" y="289" fill="#e9e0d3" font-size="14">Ninth kill: eligible special enemy</text><rect x="35" y="310" width="350" height="56" rx="7" fill="#2c241b"/><text x="49" y="334" fill="#ebca98" font-size="17" font-weight="700">4  Odin–Zeus entrance</text><text x="49" y="355" fill="#e9e0d3" font-size="14">Take the second part</text><rect x="35" y="376" width="350" height="56" rx="7" fill="#2c241b"/><text x="49" y="400" fill="#ebca98" font-size="17" font-weight="700">5  Burning blade</text><text x="49" y="421" fill="#e9e0d3" font-size="14">Kill a Gladiator and a Brawler</text><rect x="35" y="442" width="350" height="56" rx="7" fill="#2c241b"/><text x="49" y="466" fill="#ebca98" font-size="17" font-weight="700">6  Fallen Hero</text><text x="49" y="487" fill="#e9e0d3" font-size="14">Take the third part</text><rect x="35" y="508" width="350" height="56" rx="7" fill="#2c241b"/><text x="49" y="532" fill="#ebca98" font-size="17" font-weight="700">7  The Pit</text><text x="49" y="553" fill="#e9e0d3" font-size="14">Retrieve Iron Bull</text><text x="36" y="600" fill="#c2b39d" font-size="12">Later firsthand route; older target conflicts</text><text x="36" y="617" fill="#c2b39d" font-size="12">remain visible in the steps.</text></g></svg>
