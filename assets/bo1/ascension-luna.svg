<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Ascension LUNA Lunar Lander route</title><desc id="d">Diagram showing the four occupied lander calls used to collect L U N A.</desc><rect width="1200" height="700" fill="#090909"/><text x="600" y="60" text-anchor="middle" fill="#fff" font-family="Arial" font-size="36" font-weight="700">SPELL LUNA WITH OCCUPIED LANDER CALLS</text><g font-family="Arial" text-anchor="middle"><rect x="470" y="280" width="260" height="130" rx="28" fill="#161616" stroke="#d96b3c" stroke-width="5"/><text x="600" y="340" fill="#fff" font-size="34" font-weight="700">SPAWN</text><text x="600" y="380" fill="#aaa" font-size="22">Starting position</text><rect x="80" y="120" width="260" height="130" rx="28" fill="#161616" stroke="#d96b3c" stroke-width="5"/><text x="210" y="180" fill="#fff" font-size="31" font-weight="700">STAMIN-UP</text><rect x="860" y="120" width="260" height="130" rx="28" fill="#161616" stroke="#d96b3c" stroke-width="5"/><text x="990" y="180" fill="#fff" font-size="31" font-weight="700">SPEED COLA</text><path d="M485 305C390 225 340 205 310 195" fill="none" stroke="#f5b078" stroke-width="8" marker-end="url(#a)"/><text x="390" y="225" fill="#fff" font-size="25">1 · L</text><path d="M300 235C365 330 430 355 475 355" fill="none" stroke="#79b8ff" stroke-width="8" marker-end="url(#b)"/><text x="365" y="350" fill="#fff" font-size="25">2 · U</text><path d="M725 330C805 245 850 215 895 195" fill="none" stroke="#f5b078" stroke-width="8" marker-end="url(#a)"/><text x="810" y="255" fill="#fff" font-size="25">3 · N</text><path d="M895 225C720 80 420 75 305 155" fill="none" stroke="#79b8ff" stroke-width="8" marker-end="url(#b)"/><text x="600" y="105" fill="#fff" font-size="25">4 · A</text><text x="600" y="520" fill="#fff" font-size="28" font-weight="700">A RIDER STAYS ON THE LANDER FOR EVERY LEG</text><text x="600" y="565" fill="#aaa" font-size="23">Destination player calls the occupied lander. Do not buy an empty ride.</text></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f5b078"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#79b8ff"/></marker></defs></svg>