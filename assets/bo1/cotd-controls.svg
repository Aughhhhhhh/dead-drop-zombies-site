<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Call of the Dead controls and co-op order</title><desc id="d">Reference for ship levers, steering wheel, radios, foghorns and lighthouse dials.</desc><rect width="1200" height="760" fill="#090909"/><text x="600" y="55" fill="#fff" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700">CALL OF THE DEAD QUEST REFERENCE</text><g font-family="Arial"><rect x="55" y="95" width="520" height="235" rx="24" fill="#151515" stroke="#d96b3c" stroke-width="4"/><text x="90" y="140" fill="#f5b078" font-size="24" font-weight="700">SHIP CONTROLS</text><text x="90" y="185" fill="#fff" font-size="29">Levers: LEFT ×1 · MIDDLE ×0 · RIGHT ×3</text><text x="90" y="235" fill="#fff" font-size="29">Wheel: turn RIGHT ×2</text><text x="90" y="280" fill="#aaa" font-size="22">Brown wheel handle ends near 5 o'clock.</text><rect x="625" y="95" width="520" height="235" rx="24" fill="#151515" stroke="#d96b3c" stroke-width="4"/><text x="660" y="140" fill="#f5b078" font-size="24" font-weight="700">LIGHTHOUSE DIALS · TOP TO BOTTOM</text><text x="660" y="210" fill="#fff" font-size="48" font-weight="700">2 · 7 · 4 · 6</text><text x="660" y="260" fill="#aaa" font-size="22">Yellow · Orange · Blue · Purple</text><rect x="55" y="370" width="520" height="300" rx="24" fill="#151515" stroke="#444" stroke-width="4"/><text x="90" y="415" fill="#79b8ff" font-size="24" font-weight="700">RADIOS · EXACT ORDER</text><text x="90" y="460" fill="#fff" font-size="25">1. Cabinet below power room</text><text x="90" y="505" fill="#fff" font-size="25">2. Barrel in Stamin-Up cabin</text><text x="90" y="550" fill="#fff" font-size="25">3. Rear-ship shipping container</text><text x="90" y="595" fill="#fff" font-size="25">4. Under stairs behind Ultimis wall</text><rect x="625" y="370" width="520" height="300" rx="24" fill="#151515" stroke="#444" stroke-width="4"/><text x="660" y="415" fill="#79b8ff" font-size="24" font-weight="700">FOGHORNS · DURING FOG</text><text x="660" y="460" fill="#fff" font-size="24">1. Water horn at lighthouse base</text><text x="660" y="505" fill="#fff" font-size="24">2. Water horn right of icy slide</text><text x="660" y="550" fill="#fff" font-size="24">3. Near land horn by lighthouse doors</text><text x="660" y="595" fill="#fff" font-size="24">4. Far land horn behind the rock</text></g></svg>