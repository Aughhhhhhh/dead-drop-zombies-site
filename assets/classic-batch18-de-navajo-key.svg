ize="21" font-weight="400" text-anchor="start">AH-JAH</text><text x="420" y="381" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">E</text><rect x="40" y="398" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="54" y="427" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">MOASI</text><text x="420" y="427" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">C</text><rect x="40" y="444" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="54" y="473" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">DZEH</text><text x="420" y="473" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">E</text><rect x="40" y="490" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="54" y="519" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">YEH-HES</text><text x="420" y="519" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">I</text><rect x="40" y="536" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="54" y="565" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">A-KEH-DI-GLINI</text><text x="420" y="565" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">V</text><rect x="40" y="582" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="54" y="611" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">LHA-CHA-EH</text><text x="420" y="611" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">D</text><rect x="40" y="628" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="54" y="657" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">WOL-LA-CHEE</text><text x="420" y="657" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">A</text><text x="574" y="150" fill="#aabed0" font-size="17" font-weight="400" text-anchor="start">TOKEN</text><text x="940" y="150" fill="#aabed0" font-size="17" font-weight="400" text-anchor="start">MEANING</text><rect x="560" y="168" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="574" y="197" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">TSAH</text><text x="940" y="197" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">N</text><rect x="560" y="214" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="574" y="243" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">NE-AHS-JAH</text><text x="940" y="243" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">O</text><rect x="560" y="260" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="574" y="289" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">THAN-ZIE</text><text x="940" y="289" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">T</text><rect x="560" y="306" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="574" y="335" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">GAH</text><text x="940" y="335" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">R</text><rect x="560" y="352" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="574" y="381" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">A-WOH</text><text x="940" y="381" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">T</text><rect x="560" y="398" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="574" y="427" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">TSAH-AS-ZIH</text><text x="940" y="427" fill="#f1bd56" font-size="21" font-weight="700" text-anchor="start">Y</text><rect x="560" y="444" width="500" height="44" rx="4" fill="#142235" stroke="#39526a"/><text x="574" y="473" fill="#e8edf5" font-size="21" font-weight="400" text-anchor="start">CLA-GI-A