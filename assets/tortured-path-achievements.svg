<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#19272d"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#718d94"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">THE TORTURED PATH</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Ten achievements</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">Three escapes</text><text x="49" y="159" fill="#e2ebec" font-size="14">Finish each chapter and reach its</text><text x="49" y="177" fill="#e2ebec" font-size="14">extraction</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Quest completion</text><text x="49" y="275" fill="#e2ebec" font-size="14">Follow the Hilt, Pommel and Sword</text><text x="49" y="293" fill="#e2ebec" font-size="14">routes</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">Team and challenge goals</text><text x="49" y="391" fill="#e2ebec" font-size="14">Read each trophy description and the</text><text x="49" y="409" fill="#e2ebec" font-size="14">known limits</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#293e46"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Engineered Parts</text><text x="49" y="507" fill="#e2ebec" font-size="14">The full reliable upgrade procedure</text><text x="49" y="525" fill="#e2ebec" font-size="14">remains unresolved</text><text x="36" y="600" fill="#afc1c5" font-size="12">Historical descriptions; exact credit and</text><text x="36" y="617" fill="#afc1c5" font-size="12">current unlocks are untested.</text></g></svg>
