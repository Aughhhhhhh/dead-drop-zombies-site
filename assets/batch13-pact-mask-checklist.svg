<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830"><title>Seven tiger-mask landmarks</title><rect width="1200" height="830" rx="24" fill="#13181d"/><g fill="#f4f1e9" font-family="Arial, sans-serif"><text x="50" y="76" font-size="40" font-weight="bold">Tiger masks: choose your current region</text><text x="50" y="120" font-size="27" fill="#b8c2c9">Touch one mask → finish the regional objective → warp to Zoo</text><path d="M50 220H1150" stroke="#35414a"/><text x="50" y="195" font-size="29" fill="#ffb54d">Ruka</text><text x="300" y="195" font-size="29">Obstacle Course</text><path d="M50 296H1150" stroke="#35414a"/><text x="50" y="271" font-size="29" fill="#ffb54d">Golova</text><text x="300" y="271" font-size="29">Town Center statue base</text><path d="M50 372H1150" stroke="#35414a"/><text x="50" y="347" font-size="29" fill="#ffb54d">Alpine</text><text x="300" y="347" font-size="29">Below Lower Chairlift</text><path d="M50 448H1150" stroke="#35414a"/><text x="50" y="423" font-size="29" fill="#ffb54d">Duga</text><text x="300" y="423" font-size="29">Unused Lot bus-stop bench</text><path d="M50 524H1150" stroke="#35414a"/><text x="50" y="499" font-size="29" fill="#ffb54d">Sanatorium</text><text x="300" y="499" font-size="29">Bottom of Sanatorium Pool</text><path d="M50 600H1150" stroke="#35414a"/><text x="50" y="575" font-size="29" fill="#ffb54d">Collateral</text><text x="300" y="575" font-size="29">Warehouse: right doorway opposite PaP</text><path d="M50 676H1150" stroke="#35414a"/><text x="50" y="651" font-size="29" fill="#ffb54d">Armada</text><text x="300" y="651" font-size="29">Central ship: Control Room</text><text x="50" y="785" font-size="24" fill="#b8c2c9">Original location checklist • schematic, not a spatial map or gameplay screenshot</text></g></svg>
