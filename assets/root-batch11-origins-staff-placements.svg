<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 805" role="img" aria-labelledby="title desc">
<title id="title">Little Lost Girl: four ultimate-staff destinations</title><desc id="desc">Place ultimate Ice in Freya, Wind in Odin, Lightning in Thor and Fire in the new lower excavation stand. All six generators must be operating.</desc>
<rect width="1040" height="805" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Little Lost Girl: four ultimate-staff destinations</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><text x="48" y="150" font-size="23" fill="#acbca1" font-weight="normal">ASCEND FROM DARKNESS: ALL FOUR STAFFS MUST BE ULTIMATE</text><rect x="36" y="181" width="968" height="90" rx="8" fill="#20271f" stroke="#91cce0" stroke-width="2"/><text x="60" y="235" font-size="27" fill="#91cce0" font-weight="bold">ICE</text><text x="303" y="235" font-size="25" fill="#e3e7d8" font-weight="normal">Freya · Church robot</text><rect x="36" y="286" width="968" height="90" rx="8" fill="#20271f" stroke="#e1c46d" stroke-width="2"/><text x="60" y="340" font-size="27" fill="#e1c46d" font-weight="bold">WIND</text><text x="303" y="340" font-size="25" fill="#e3e7d8" font-weight="normal">Odin · middle robot</text><rect x="36" y="391" width="968" height="90" rx="8" fill="#20271f" stroke="#bc9ade" stroke-width="2"/><text x="60" y="445" font-size="27" fill="#bc9ade" font-weight="bold">LIGHTNING</text><text x="303" y="445" font-size="25" fill="#e3e7d8" font-weight="normal">Thor · spawn-side robot</text><rect x="36" y="496" width="968" height="90" rx="8" fill="#20271f" stroke="#e29d83" stroke-width="2"/><text x="60" y="550" font-size="27" fill="#e29d83" font-weight="bold">FIRE</text><text x="303" y="550" font-size="25" fill="#e3e7d8" font-weight="normal">New central stand · bottom of excavation</text><text x="48" y="650" font-size="24" fill="#e3e7d8" font-weight="normal">All six generators must be active for staff placement to finish.</text><text x="48" y="693" font-size="24" fill="#e3e7d8" font-weight="normal">The special Fire stand is in front of the original four stands.</text><text x="48" y="736" font-size="24" fill="#e3e7d8" font-weight="normal">Wait for confirmation and recover the staffs at excavation.</text><text x="36" y="780" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
