<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#1c2732"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#77a4bd"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#b4cfe1" font-size="12" letter-spacing="2">DESCENT · EXO ZOMBIES</text><text x="36" y="86" fill="#f6dfb8" font-size="24" font-weight="700">Achievements and trophies</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#2b3b4d"/><text x="49" y="137" fill="#c2dceb" font-size="17" font-weight="700">Ten reported criteria</text><text x="49" y="159" fill="#e0e7ef" font-size="14">Historical rows include missing</text><text x="49" y="177" fill="#e0e7ef" font-size="14">inputs and conflicts</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#2b3b4d"/><text x="49" y="253" fill="#c2dceb" font-size="17" font-weight="700">Separate completions</text><text x="49" y="275" fill="#e0e7ef" font-size="14">Reunion and Double Feature have</text><text x="49" y="293" fill="#e0e7ef" font-size="14">different endings</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#2b3b4d"/><text x="49" y="369" fill="#c2dceb" font-size="17" font-weight="700">Check your platform</text><text x="49" y="391" fill="#e0e7ef" font-size="14">The Big Game weapon reports disagree</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#2b3b4d"/><text x="49" y="485" fill="#c2dceb" font-size="17" font-weight="700">Two harpoon reports</text><text x="49" y="507" fill="#e0e7ef" font-size="14">Display items do not prove account</text><text x="49" y="525" fill="#e0e7ef" font-size="14">persistence</text><text x="36" y="600" fill="#b4c6d9" font-size="12">A criterion checklist is not a completed</text><text x="36" y="617" fill="#b4c6d9" font-size="12">route. Read each row and its remaining limits.</text></g></svg>
