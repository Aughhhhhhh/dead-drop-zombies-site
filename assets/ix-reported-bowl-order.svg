<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#1b1712"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#786448"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#e3b477" font-size="12" letter-spacing="2">IX · CLASSIC</text><text x="36" y="86" fill="#faf2e7" font-size="24" font-weight="700">Reported bowl order</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#2c241b"/><text x="49" y="136" fill="#ebca98" font-size="17" font-weight="700">1  Left Ra</text><text x="49" y="157" fill="#e9e0d3" font-size="14">2  Left Zeus</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#2c241b"/><text x="49" y="252" fill="#ebca98" font-size="17" font-weight="700">3  Right Odin</text><text x="49" y="273" fill="#e9e0d3" font-size="14">4  Right Danu</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#2c241b"/><text x="49" y="368" fill="#ebca98" font-size="17" font-weight="700">5  Left Danu</text><text x="49" y="389" fill="#e9e0d3" font-size="14">6  Left Odin</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#2c241b"/><text x="49" y="484" fill="#ebca98" font-size="17" font-weight="700">7  Right Ra</text><text x="49" y="505" fill="#e9e0d3" font-size="14">8  Right Zeus</text><text x="36" y="600" fill="#c2b39d" font-size="12">Historical order only. The left/right</text><text x="36" y="617" fill="#c2b39d" font-size="12">viewpoint and later continuation remain</text><text x="36" y="634" fill="#c2b39d" font-size="12">unverified.</text></g></svg>
