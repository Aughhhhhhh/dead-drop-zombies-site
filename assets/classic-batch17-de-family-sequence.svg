<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img"><title>Family photo: round 2 recipe</title><rect width="1100" height="690" fill="#0b1522"/><g font-family="Arial, sans-serif"><text x="40" y="56" fill="#e8edf5" font-size="32" font-weight="700">Family photo: round 2 recipe</text><text x="40" y="92" fill="#aabed0" font-size="19" font-weight="400">Stay in Spawn. First let all five barricades lose every board.</text><rect x="40" y="132" width="500" height="86" rx="16" fill="#142235" stroke="#39526a"/><rect x="600" y="132" width="460" height="86" rx="16" fill="#142235" stroke="#39526a"/><text x="62" y="184" fill="#e8edf5" font-size="26" font-weight="700">2 boards at EACH of 5 windows</text><text x="622" y="184" fill="#e8edf5" font-size="25" font-weight="700">Buy RK5</text><path d="M553 175H585l-10 -10m10 10l-10 10" fill="none" stroke="#f1bd56" stroke-width="4"/><rect x="40" y="243" width="500" height="86" rx="16" fill="#142235" stroke="#39526a"/><rect x="600" y="243" width="460" height="86" rx="16" fill="#142235" stroke="#39526a"/><text x="62" y="295" fill="#e8edf5" font-size="26" font-weight="700">4 boards at EACH of 5 windows</text><text x="622" y="295" fill="#e8edf5" font-size="25" font-weight="700">Replace RK5 with Sheiva</text><path d="M553 286H585l-10 -10m10 10l-10 10" fill="none" stroke="#f1bd56" stroke-width="4"/><rect x="40" y="354" width="500" height="86" rx="16" fill="#142235" stroke="#39526a"/><rect x="600" y="354" width="460" height="86" rx="16" fill="#142235" stroke="#39526a"/><text x="62" y="406" fill="#e8edf5" font-size="26" font-weight="700">5 boards at EACH of 5 windows</text><text x="622" y="406" fill="#e8edf5" font-size="25" font-weight="700">Replace Sheiva with RK5</text><path d="M553 397H585l-10 -10m10 10l-10 10" fill="none" stroke="#f1bd56" stroke-width="4"/><rect x="40" y="486" width="1020" height="111" rx="16" fill="#142235" stroke="#39526a"/><text x="64" y="525" fill="#f1bd56" font-size="23" font-weight="700">WITHIN 5 SECONDS OF THE FINAL RK5 PURCHASE</text><text x="64" y="566" fill="#e8edf5" font-size="25" font-weight="400">Open the KRM-side exit and look outside for the heart-shaped photo.</text><text x="40" y="636" fill="#e8edf5" font-size="20" font-weight="400">Exact order required. Start without the automatically awarded RK5.</text><text x="40" y="666" fill="#aabed0" font-size="16" font-weight="400">Original sequence diagram • Add 2 boards, then 2 more, then 1 more at every window</text></g></svg>