<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Origins Rain Fire seal location diagram</title><desc id="desc">Diagram showing Generator 5, Stamin-Up route, robot footprint lane, and the circular stone seal targeted by the G-Strike.</desc>
<rect width="1200" height="700" fill="#090909"/><path d="M110 520 C300 400 440 420 600 350 S920 270 1080 130" fill="none" stroke="#343434" stroke-width="120" stroke-linecap="round"/><path d="M100 575 C300 455 445 475 615 400 S930 320 1110 180" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="18 16"/><rect x="100" y="90" width="260" height="150" rx="24" fill="#151515" stroke="#d96b3c" stroke-width="4"/><text x="230" y="155" fill="#fff" font-family="Arial" font-size="40" text-anchor="middle" font-weight="700">GENERATOR 5</text><text x="230" y="200" fill="#aaa" font-family="Arial" font-size="24" text-anchor="middle">Stamin-Up side</text><ellipse cx="720" cy="395" rx="105" ry="55" fill="#151515" stroke="#d96b3c" stroke-width="8"/><ellipse cx="720" cy="395" rx="55" ry="26" fill="#050505" stroke="#f5b078" stroke-width="4"/><text x="720" y="500" fill="#fff" font-family="Arial" font-size="32" text-anchor="middle" font-weight="700">THROW G-STRIKE HERE</text><path d="M720 475v-45" stroke="#f5b078" stroke-width="6" marker-end="url(#a)"/><text x="870" y="300" fill="#bbb" font-family="Arial" font-size="25">Robot footprint lane</text><path d="M860 315L780 365" stroke="#bbb" stroke-width="3"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b078"/></marker></defs><text x="70" y="650" fill="#777" font-family="Arial" font-size="22">Use this as a location guide; terrain is simplified for clarity.</text></svg>
