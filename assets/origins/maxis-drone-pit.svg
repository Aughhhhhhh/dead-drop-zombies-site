<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Origins Maxis Drone pit placement diagram</title><desc id="desc">Diagram showing the opened seal, player position beside the opening, and Maxis Drone flight path down into the pit.</desc>
<rect width="1200" height="700" fill="#090909"/><ellipse cx="650" cy="430" rx="260" ry="120" fill="#141414" stroke="#d96b3c" stroke-width="10"/><ellipse cx="650" cy="430" rx="150" ry="65" fill="#020202" stroke="#f5b078" stroke-width="5"/><path d="M650 115 C660 210 650 270 650 355" fill="none" stroke="#f5b078" stroke-width="8" stroke-dasharray="20 14" marker-end="url(#a)"/><g transform="translate(585 65)"><rect x="0" y="35" width="130" height="50" rx="18" fill="#ddd"/><circle cx="25" cy="95" r="15" fill="#d96b3c"/><circle cx="105" cy="95" r="15" fill="#d96b3c"/><path d="M15 35L0 5M115 35l15-30" stroke="#ddd" stroke-width="8"/></g><circle cx="320" cy="415" r="38" fill="#aaa"/><path d="M320 453v92M320 475l-55 65M320 475l55 65" stroke="#aaa" stroke-width="18" stroke-linecap="round"/><text x="270" y="610" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Stand beside the opening</text><text x="650" y="650" fill="#fff" font-family="Arial" font-size="32" text-anchor="middle" font-weight="700">Deploy the Maxis Drone facing into the pit</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b078"/></marker></defs></svg>
