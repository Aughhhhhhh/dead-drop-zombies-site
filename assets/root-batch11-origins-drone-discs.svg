<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc">
<title id="title">Free Magna Collider: four elevated yellow discs</title><desc id="desc">Four yellow-disc target landmarks and the free Magna Collider collection area; the Drone must fetch each elevated disc.</desc>
<rect width="1040" height="728" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Free Magna Collider: four elevated yellow discs</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><rect x="36" y="139" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="170" font-size="23" fill="#c1cfab" font-weight="bold">SPAWN EXIT TOWARD GENERATOR 2</text><text x="58" y="202" font-size="22" fill="#e3e7d8" font-weight="normal">Burning debris beyond the playable boundary on the right.</text><rect x="36" y="235" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="266" font-size="23" fill="#c1cfab" font-weight="bold">GENERATOR 5 · STAMIN-UP</text><text x="58" y="298" font-size="22" fill="#e3e7d8" font-weight="normal">Elevated roof / wooden strip above the nearby window.</text><rect x="36" y="331" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="362" font-size="23" fill="#c1cfab" font-weight="bold">EXCAVATION</text><text x="58" y="394" font-size="22" fill="#e3e7d8" font-weight="normal">High wooden scaffolding toward the Church route.</text><rect x="36" y="427" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="458" font-size="23" fill="#c1cfab" font-weight="bold">CHURCH</text><text x="58" y="490" font-size="22" fill="#e3e7d8" font-weight="normal">Roof corner above the main entrance.</text><rect x="36" y="523" width="968" height="82" rx="8" fill="#20271f" stroke="#465342" stroke-width="2"/><text x="58" y="554" font-size="23" fill="#c1cfab" font-weight="bold">REWARD · PACK-A-PUNCH</text><text x="58" y="586" font-size="22" fill="#e3e7d8" font-weight="normal">After all four are collected, take the upgraded MG08/15 at the mound.</text><text x="48" y="661" font-size="22" fill="#e3e7d8" font-weight="normal">Deploy the Drone and approach each target; wait for its disc to disappear.</text><text x="36" y="703" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
