<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc">
<title id="title">Fire Staff: Church wall values and torch rule</title><desc id="desc">The seven Church wall values are 11, 5, 9, 7, 6, 3 and 4 from left to right. Shoot the current lit set downstairs and include the blood-marked 4.</desc>
<rect width="1040" height="720" fill="#151b16"/><g font-family="Arial,sans-serif"><text x="36" y="48" font-size="30" fill="#e8e3cc" font-weight="bold">Fire Staff: Church wall values and torch rule</text><text x="36" y="82" font-size="18" fill="#acbca1" font-weight="normal">BO2 Origins · Original reference diagram · not a gameplay screenshot</text><path d="M36 104H1004" stroke="#526049"/><text x="48" y="150" font-size="23" fill="#e29d83" font-weight="normal">UPSTAIRS WALL: READ THE SEVEN GROUPS FROM LEFT TO RIGHT</text><rect x="36" y="186" width="128" height="152" rx="8" fill="#20271f" stroke="#a86f55" stroke-width="2"/><text x="52" y="219" font-size="17" fill="#acbca1" font-weight="normal">GROUP 1</text><text x="71" y="287" font-size="47" fill="#f0c4a6" font-weight="bold">11</text><rect x="176" y="186" width="128" height="152" rx="8" fill="#20271f" stroke="#a86f55" stroke-width="2"/><text x="192" y="219" font-size="17" fill="#acbca1" font-weight="normal">GROUP 2</text><text x="211" y="287" font-size="47" fill="#f0c4a6" font-weight="bold">5</text><rect x="316" y="186" width="128" height="152" rx="8" fill="#20271f" stroke="#a86f55" stroke-width="2"/><text x="332" y="219" font-size="17" fill="#acbca1" font-weight="normal">GROUP 3</text><text x="351" y="287" font-size="47" fill="#f0c4a6" font-weight="bold">9</text><rect x="456" y="186" width="128" height="152" rx="8" fill="#20271f" stroke="#a86f55" stroke-width="2"/><text x="472" y="219" font-size="17" fill="#acbca1" font-weight="normal">GROUP 4</text><text x="491" y="287" font-size="47" fill="#f0c4a6" font-weight="bold">7</text><rect x="596" y="186" width="128" height="152" rx="8" fill="#20271f" stroke="#a86f55" stroke-width="2"/><text x="612" y="219" font-size="17" fill="#acbca1" font-weight="normal">GROUP 5</text><text x="631" y="287" font-size="47" fill="#f0c4a6" font-weight="bold">6</text><rect x="736" y="186" width="128" height="152" rx="8" fill="#20271f" stroke="#a86f55" stroke-width="2"/><text x="752" y="219" font-size="17" fill="#acbca1" font-weight="normal">GROUP 6</text><text x="771" y="287" font-size="47" fill="#f0c4a6" font-weight="bold">3</text><rect x="876" y="186" width="128" height="152" rx="8" fill="#20271f" stroke="#a86f55" stroke-width="2"/><text x="892" y="219" font-size="17" fill="#acbca1" font-weight="normal">GROUP 7</text><text x="911" y="287" font-size="47" fill="#f0c4a6" font-weight="bold">4</text><text x="48" y="392" font-size="27" fill="#e3e7d8" font-weight="normal">1. Identify the glowing groups in your current match.</text><text x="48" y="441" font-size="27" fill="#e3e7d8" font-weight="normal">2. Go downstairs and find the matching numbered torches.</text><text x="48" y="490" font-size="27" fill="#e3e7d8" font-weight="normal">3. Shoot that set promptly with the Fire Staff.</text><rect x="36" y="533" width="968" height="114" rx="8" fill="#20271f" stroke="#a86f55" stroke-width="2"/><text x="60" y="578" font-size="28" fill="#f0c4a6" font-weight="bold">The blood-marked torch is 4. Always include it.</text><text x="60" y="618" font-size="24" fill="#e3e7d8" font-weight="normal">The lit values vary by match. Do not shoot all seven.</text><text x="36" y="695" font-size="18" fill="#acbca1" font-weight="normal">Dead Drop · Read the accompanying steps for the complete route.</text></g></svg>
