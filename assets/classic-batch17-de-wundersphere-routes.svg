<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img"><title>Wundersphere routes</title><rect width="1100" height="620" fill="#0b1522" /><g font-family="Arial, sans-serif"><text x="40" y="56" fill="#e8edf5" font-size="32" font-weight="700">Wundersphere routes</text><text x="40" y="92" fill="#aabed0" font-size="19" font-weight="400">Activate each receiving pad first. Every launch costs 500 points.</text><rect x="40" y="130" width="430" height="74" rx="16" fill="#142235" stroke="#39526a" /><rect x="630" y="130" width="430" height="74" rx="16" fill="#142235" stroke="#39526a" /><text x="64" y="176" fill="#e8edf5" font-size="26" font-weight="700">Above Double Tap</text><text x="654" y="176" fill="#e8edf5" font-size="26" font-weight="700">Bastion / Death Ray</text><path d="M500 167H593l-13 -13m13 13l-13 13" fill="none" stroke="#f1bd56" stroke-width="5" /><rect x="40" y="228" width="430" height="74" rx="16" fill="#142235" stroke="#39526a" /><rect x="630" y="228" width="430" height="74" rx="16" fill="#142235" stroke="#39526a" /><text x="64" y="274" fill="#e8edf5" font-size="26" font-weight="700">Rocket Pad</text><text x="654" y="274" fill="#e8edf5" font-size="26" font-weight="700">Spawn</text><path d="M500 265H593l-13 -13m13 13l-13 13" fill="none" stroke="#f1bd56" stroke-width="5" /><rect x="40" y="326" width="430" height="74" rx="16" fill="#142235" stroke="#39526a" /><rect x="630" y="326" width="430" height="74" rx="16" fill="#142235" stroke="#39526a" /><text x="64" y="372" fill="#e8edf5" font-size="26" font-weight="700">Church courtyard</text><text x="654" y="372" fill="#e8edf5" font-size="26" font-weight="700">Lower Courtyard</text><path d="M500 363H593l-13 -13m13 13l-13 13" fill="none" stroke="#f1bd56" stroke-width="5" /><rect x="40" y="424" width="430" height="74" rx="16" fill="#142235" stroke="#39526a" /><rect x="630" y="424" width="430" height="74" rx="16" fill="#142235" stroke="#39526a" /><text x="64" y="470" fill="#e8edf5" font-size="26" font-weight="700">Death Ray</text><text x="654" y="470" fill="#e8edf5" font-size="26" font-weight="700">Rocket Pad</text><path d="M500 461H593l-13 -13m13 13l-13 13" fill="none" stroke="#f1bd56" stroke-width="5" /><text x="40" y="558" fill="#e8edf5" font-size="22" font-weight="400">Players standing together inside a sphere can share the purchased launch.</text><text x="40" y="596" fill="#aabed0" font-size="16" font-weight="400">Original diagram • Not a floor plan</text></g></svg>