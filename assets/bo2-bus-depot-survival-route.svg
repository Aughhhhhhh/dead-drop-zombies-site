<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">BUS DEPOT / SURVIVAL</title><desc id="desc">Original route schematic · positions are relative to the depot exit; not to scale Survival has no perk machines or Pack-a-Punch. TranZit bus / fog routes are outside this mode.</desc><rect width="960" height="540" fill="#0c1418"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="49" fill="#f0f5f5" font-size="29" font-weight="700">BUS DEPOT / SURVIVAL</text><text x="36" y="78" fill="#9dafb8" font-size="16">Original route schematic · positions are relative to the depot exit; not to scale</text><path d="M315 265 L410 265" stroke="#a4b5bd" stroke-width="3" fill="none"/><text x="315" y="245" fill="#becad0" font-size="15">750-point exit</text><g><rect x="45" y="185" width="270" height="160" rx="12" fill="#132026" stroke="#f2ac78" stroke-width="2"/><text x="65" y="216" fill="#f2ac78" font-size="17" font-weight="700">STARTING DEPOT</text><text x="65" y="249" fill="#e6eded" font-size="17">M14 / Olympia</text><text x="65" y="276" fill="#e6eded" font-size="17">No buildable Turbine</text><text x="65" y="303" fill="#e6eded" font-size="17">Buy the exit</text></g><g><rect x="410" y="138" width="500" height="290" rx="12" fill="#132026" stroke="#79c9c1" stroke-width="2"/><text x="430" y="169" fill="#79c9c1" font-size="17" font-weight="700">OUTSIDE YARD</text><text x="430" y="202" fill="#e6eded" font-size="17">Fixed Mystery Box — left of the exit</text><text x="430" y="229" fill="#e6eded" font-size="17">MP5 — across from the depot</text><text x="430" y="256" fill="#e6eded" font-size="17">Remington 870 — exterior wall</text><text x="430" y="283" fill="#e6eded" font-size="17">Use the open space to move</text></g><path d="M36 467H924" stroke="#33454f"/><text x="36" y="502" fill="#9dafb8" font-size="15">Survival has no perk machines or Pack-a-Punch. TranZit bus / fog routes are outside this mode.</text></g></svg>
