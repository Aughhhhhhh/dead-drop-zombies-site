<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img"><title>The Castle • reverse both transpositions</title><rect width="1100" height="800" fill="#0b1522"/><g font-family="Arial, sans-serif"><text x="40" y="55" fill="#e8edf5" font-size="32" font-weight="700" text-anchor="start">The Castle • reverse both transpositions</text><text x="40" y="94" fill="#aabed0" font-size="19" font-weight="400" text-anchor="start">A worked reconstruction of the retained ciphertext, with a checked round trip.</text><text x="40" y="145" fill="#aabed0" font-size="17" font-weight="400" text-anchor="start">CASE-SENSITIVE KEY</text><rect x="60" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="114" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">T</text><rect x="60" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="114" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">2</text><rect x="168" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="222" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">h</text><rect x="168" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="222" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">6</text><rect x="276" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="330" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">e</text><rect x="276" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="330" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">4</text><rect x="384" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="438" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">C</text><rect x="384" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="438" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">1</text><rect x="492" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="546" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">a</text><rect x="492" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="546" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">3</text><rect x="600" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="654" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">s</text><rect x="600" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="654" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">8</text><rect x="708" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="762" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">t</text><rect x="708" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="762" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">9</text><rect x="816" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="870" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">l</text><rect x="816" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="870" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">7</text><rect x="924" y="163" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="978" y="203" fill="#e8edf5" font-size="30" font-weight="700" text-anchor="middle">e</text><rect x="924" y="221" width="108" height="58" rx="0" fill="#142235" stroke="#39526a"/><text x="978" y="261" fill="#f1bd56" font-size="30" font-weight="700" text-anchor="middle">5</text><text x="40" y="317" fill="#aabed0" font-size="22" font-weight="400" text-anchor="start">The numeric ranks above avoid a decoder’s letter-case defaults.</text><rect x="40" y="352" width="490" height="251" rx="14" fill="#142235" stroke="#39526a"/><text x="58" y="396" fill="#f1bd56" font-size="25" font-weight="700" text-anchor="start">PASS 1 • 115 characters</text><text x="58" y="445" fill="#e8edf5" font-size="22" font-weight="400" text-anchor="start">Columns 1–7: 13 positions each.</text><text x="58" y="485" fill="#e8edf5" font-size="22" font-weight="400" text-anchor="start">Columns 8–9: 12 positions each.</text><text x="58" y="525" fill="#e8edf5" font-size="22" font-weight="400" text-anchor="start">Fill top to bottom by ranks 1→9.</text><text x="58" y="565" fill="#e8edf5" font-size="22" font-weight="400" text-anchor="start">Read rows from left to right.</text><rect x="570" y="352" width="490" height="251" rx="14" fill="#142235" stroke="#39526a"/><text x="588" y="396" fill="#f1bd56" font-size="25" font-weight="700" text-anchor="start">PASS 2 • 113 characters</text><text x="588" y="445" fill="#e8edf5" font-size="22" font-weight="400" text-anchor="start">Columns 1–5: 13 positions each.</text><text x="588" y="485" fill="#e8edf5" font-size="22" font-weight="400" text-anchor="start">Columns 6–9: 12 positions each.</text><text x="588" y="525" fill="#e8edf5" font-size="22" font-weight="400" text-anchor="start">Fill top to bottom by ranks 1→9.</text><text x="588" y="565" fill="#e8edf5" font-size="22" font-weight="400" text-anchor="start">Read rows from left to right.</text><text x="40" y="665" fill="#e8edf5" font-size="24" font-weight="700" text-anchor="start">Between the passes: remove exactly two trailing Z pad characters.</text><text x="40" y="710" fill="#e8edf5" font-size="23" font-weight="400" text-anchor="start">Keep all spaces and punctuation. The result begins with one space.</text><text x="40" y="776" fill="#aabed0" font-size="16" font-weight="400" text-anchor="start">Original decoder diagram • Not a gameplay photograph</text></g></svg>
