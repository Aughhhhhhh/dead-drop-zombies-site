<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Balmung antiquity dial reference</title><desc id="desc">Match your antiquity to its zodiac and element, then place both symbols at the bottom of the dial. Lion jaw Leo Fire. Two headed bird skull Gemini Air. Ram horn Aries Fire. Fish Pisces Water. Scorpion Scorpio Water.</desc>
<rect width="1200" height="700" fill="#151810"/>
<g font-family="Arial,sans-serif" fill="#e9ecdf">
<text x="55" y="66" font-size="18" fill="#cf7a3c" letter-spacing="3">CITADELLE DES MORTS / SHADOW SWORD</text>
<text x="55" y="123" font-size="40" font-weight="bold">Match the antiquity. Set both symbols at 6 o’clock.</text>
<text x="55" y="165" font-size="21" fill="#b6bba8">Read the object picked up in the Alchemy Lab. Use this fixed pairing at the Tavern Cellar dial.</text>
<text x="80" y="226" font-size="19" fill="#cf7a3c">ANTIQUITY</text><text x="500" y="226" font-size="19" fill="#cf7a3c">ZODIAC</text><text x="830" y="226" font-size="19" fill="#cf7a3c">ELEMENT</text>
<rect x="55" y="253" width="1090" height="65" rx="5" fill="#22271b"/><text x="80" y="295" font-size="27">Lion jaw</text><text x="500" y="295" font-size="27">Leo</text><text x="918" y="295" font-size="25">Fire</text><polygon points="843,303 887,303 865,267" fill="none" stroke="#d0d6b5" stroke-width="3"/><rect x="55" y="326" width="1090" height="65" rx="5" fill="#1c2017"/><text x="80" y="368" font-size="27">Two-headed bird skull</text><text x="500" y="368" font-size="27">Gemini</text><text x="918" y="368" font-size="25">Air</text><polygon points="843,376 887,376 865,340" fill="none" stroke="#d0d6b5" stroke-width="3"/><path d="M842 362h46" stroke="#d0d6b5" stroke-width="3"/><rect x="55" y="399" width="1090" height="65" rx="5" fill="#22271b"/><text x="80" y="441" font-size="27">Ram / urial horn</text><text x="500" y="441" font-size="27">Aries</text><text x="918" y="441" font-size="25">Fire</text><polygon points="843,449 887,449 865,413" fill="none" stroke="#d0d6b5" stroke-width="3"/><rect x="55" y="472" width="1090" height="65" rx="5" fill="#1c2017"/><text x="80" y="514" font-size="27">Fish / mudskipper fossil</text><text x="500" y="514" font-size="27">Pisces</text><text x="918" y="514" font-size="25">Water</text><polygon points="843,487 887,487 865,523" fill="none" stroke="#d0d6b5" stroke-width="3"/><rect x="55" y="545" width="1090" height="65" rx="5" fill="#22271b"/><text x="80" y="587" font-size="27">Scorpion fossil</text><text x="500" y="587" font-size="27">Scorpio</text><text x="918" y="587" font-size="25">Water</text><polygon points="843,560 887,560 865,596" fill="none" stroke="#d0d6b5" stroke-width="3"/><text x="55" y="662" font-size="18" fill="#9ca28f">Original reference diagram based on r/CODZombies. Symbol shapes are schematic; this is not a gameplay screenshot.</text></g></svg>