<svg xmlns="http://www.w3.org/2000/svg" width="420" height="660" viewBox="0 0 420 660"><rect width="420" height="660" fill="#171f25"/><rect x="18" y="18" width="384" height="624" rx="12" fill="none" stroke="#6d7b86"/><g font-family="Arial,sans-serif"><text x="36" y="53" fill="#c8d2d8" font-size="12" letter-spacing="2">TAG DER TOTEN · CLASSIC</text><text x="36" y="86" fill="#f6e7bd" font-size="24" font-weight="700">Secret island route</text><rect x="35" y="112" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="137" fill="#b8dce0" font-size="17" font-weight="700">Prepare</text><text x="49" y="159" fill="#e2ebec" font-size="14">Repair the Outer Walkway flinger; prepare</text><text x="49" y="177" fill="#e2ebec" font-size="14">for cold-water damage.</text><rect x="35" y="228" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="253" fill="#b8dce0" font-size="17" font-weight="700">Reported launch</text><text x="49" y="275" fill="#e2ebec" font-size="14">Crouch and spin at the reported corner.</text><text x="49" y="293" fill="#e2ebec" font-size="14">Exact trigger is unresolved.</text><rect x="35" y="344" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="369" fill="#b8dce0" font-size="17" font-weight="700">Remote shore</text><text x="49" y="391" fill="#e2ebec" font-size="14">Identify the small island landing; the</text><text x="49" y="409" fill="#e2ebec" font-size="14">photo shows this destination.</text><rect x="35" y="460" width="350" height="106" rx="7" fill="#24333c"/><text x="49" y="485" fill="#b8dce0" font-size="17" font-weight="700">Swim the cavern</text><text x="49" y="507" fill="#e2ebec" font-size="14">Reach the far side for the achievement;</text><text x="49" y="525" fill="#e2ebec" font-size="14">plan survival first.</text><text x="36" y="600" fill="#afc1c5" font-size="12">Launch reports disagree. No guaranteed setup or</text><text x="36" y="617" fill="#afc1c5" font-size="12">safe return is established.</text></g></svg>
